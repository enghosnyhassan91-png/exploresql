ionAr":"إتمام جميع مراحل العالم 11 (RANK, LAG, LEAD, NTILE, frames)","icon":"🏯","worldReq":11},{"id":"b_world12","titleEn":"Recursion Lord","titleAr":"سيد التكرار","descriptionEn":"Master all stages in World 12 (Multiple CTEs, recursive CTEs, hierarchies)","descriptionAr":"إتمام جميع مراحل العالم 12 (Multiple CTEs, recursive CTEs, hierarchies)","icon":"🌀","worldReq":12},{"id":"b_world13","titleEn":"Master Smith","titleAr":"كبير الحدادين","descriptionEn":"Master all stages in World 13 (Multi-row INSERT, UPSERT, UPDATE/DELETE with subqueries)","descriptionAr":"إتمام جميع مراحل العالم 13 (Multi-row INSERT, UPSERT, UPDATE/DELETE with subqueries)","icon":"🔨","worldReq":13},{"id":"b_world14","titleEn":"Chief Architect","titleAr":"كبير المعماريين","descriptionEn":"Master all stages in World 14 (CREATE, ALTER, VIEW, INDEX, DROP)","descriptionAr":"إتمام جميع مراحل العالم 14 (CREATE, ALTER, VIEW, INDEX, DROP)","icon":"🏗️","worldReq":14},{"id":"b_world15","titleEn":"Grand Architect","titleAr":"المعماري الأعظم","descriptionEn":"Master all stages in World 15 (Top-N, pivots, correlated queries, final trial)","descriptionAr":"إتمام جميع مراحل العالم 15 (Top-N, pivots, correlated queries, final trial)","icon":"🏆","worldReq":15},{"id":"b_stars30","titleEn":"Star Collector","titleAr":"جامع النجوم الذهبية","descriptionEn":"Collect 30 or more stars across campaign quests","descriptionAr":"جمع 30 نجمة أو أكثر عبر حل التحديات بدقة عالية","icon":"🌟","starReq":30}],"quiz":[{"id":1,"questionEn":"Which SQL clause is used to filter groups created by GROUP BY?","questionAr":"أي جملة في SQL تُستخدم لتصفية المجموعات الناتجة عن GROUP BY؟","options":["WHERE","HAVING","ORDER BY","LIMIT"],"correctIndex":1,"explanationEn":"HAVING filters groups after aggregation, whereas WHERE filters individual rows before grouping.","explanationAr":"تُستخدم HAVING لتصفية المجموعات بعد التجميع، بينما تصفي WHERE الصفوف الفردية قبل التجميع.","lv":7},{"id":2,"questionEn":"Which JOIN returns all rows from the left table even if there is no match in the right table?","questionAr":"أي نوع ربط يُرجع جميع صفوف الجدول الأيسر حتى لو لم يوجد تطابق في الجدول الأيمن؟","options":["INNER JOIN","LEFT JOIN","CROSS JOIN","FULL JOIN"],"correctIndex":1,"explanationEn":"LEFT JOIN preserves all rows from the left table, filling missing right-side columns with NULL.","explanationAr":"يحتفظ LEFT JOIN بجميع صفوف الجدول الأيسر ويضع NULL في أعمدة الجدول الأيمن غير المتطابقة.","lv":10},{"id":3,"questionEn":"What happens if you run an UPDATE statement without a WHERE clause?","questionAr":"ماذا يحدث عند تنفيذ أمر UPDATE بدون جملة WHERE؟","options":["Updates only the first row","Throws a syntax error","Updates EVERY row in the table","Deletes the table"],"correctIndex":2,"explanationEn":"Omitting WHERE modifies every single row in the entire table!","explanationAr":"إغفال شرط WHERE يؤدي لتعديل جميع الصفوف الموجودة في الجدول بالكامل!","lv":14},{"id":4,"questionEn":"Which keyword removes duplicate rows from a query result?","questionAr":"ما الكلمة المفتاحية التي تحذف القيم المكررة من نتائج الاستعلام؟","options":["UNIQUE","DISTINCT","DIFFERENT","SINGLE"],"correctIndex":1,"explanationEn":"SELECT DISTINCT returns only unique values across selected columns.","explanationAr":"تُستخدم DISTINCT بعد SELECT لاسترجاع القيم الفريدة دون تكرار.","lv":4},{"id":5,"questionEn":"Which clause defines a Common Table Expression (CTE) in SQL?","questionAr":"ما الكلمة التي تبدأ بها الجداول التعبيرية المشتركة (CTE) في SQL؟","options":["TEMP","WITH","OVER","CASE"],"correctIndex":1,"explanationEn":"WITH cte_name AS (...) defines a clean temporary result set.","explanationAr":"تبدأ الجداول التعبيرية المشتركة بكلمة WITH متبوعة باسم الجدول المؤقت و AS.","lv":18},{"id":6,"questionEn":"What does the COUNT(*) function return?","questionAr":"ماذا تُرجع دالة COUNT(*)؟","options":["Sum of all numbers","Total number of rows in the table or group","Highest value","Average of rows"],"correctIndex":1,"explanationEn":"COUNT(*) counts the total number of rows matching the query.","explanationAr":"تحسب COUNT(*) إجمالي عدد الصفوف المطابقة للاستعلام.","lv":5},{"id":7,"questionEn":"Which operator is used to search for a specified pattern in a column?","questionAr":"أي معامل يُستخدم للبحث عن نمط نصي محدد داخل العمود؟","options":["IN","LIKE","BETWEEN","CONTAINS"],"correctIndex":1,"explanationEn":"LIKE paired with % and _ wildcards enables pattern matching.","explanationAr":"يُستخدم LIKE مع رمزي % و _ لمطابقة الأنماط النصية.","lv":31},{"id":8,"questionEn":"What is the difference between RANK() and ROW_NUMBER()?","questionAr":"ما الفرق بين دالتي RANK() و ROW_NUMBER() في دوال النوافذ؟","options":["They are identical","RANK() gives same rank to tied values; ROW_NUMBER() assigns distinct sequential integers","ROW_NUMBER() skips numbers","RANK() only works on text"],"correctIndex":1,"explanationEn":"RANK() ties matching values (1, 2, 2, 4) whereas ROW_NUMBER() always increments strictly (1, 2, 3, 4).","explanationAr":"تمنح RANK نفس الرقم للقيم المتساوية بينما ترقم ROW_NUMBER تسلسلياً دائماً دون تكرار.","lv":64},{"id":9,"questionEn":"How do you test for missing/empty values in a column?","questionAr":"كيف تتحقق من القيم الفارغة أو غير المعرفة (NULL) في SQL؟","options":["col = NULL","col IS NULL","col == NULL","col IN (NULL)"],"correctIndex":1,"explanationEn":"NULL represents unknown, so equality (=) fails. You must use IS NULL or IS NOT NULL.","explanationAr":"تمثل NULL قيمة غير معلومة لذلك لا تعمل معها المساواة =، بل يجب كتابة IS NULL أو IS NOT NULL.","lv":2},{"id":10,"questionEn":"Which clause is used to limit the number of rows returned?","questionAr":"أي جملة تُستخدم لتحديد الحد الأقصى لعدد الصفوف المسترجعة؟","options":["TOP_ONLY","LIMIT","MAX_ROWS","CAP"],"correctIndex":1,"explanationEn":"LIMIT N caps the result to at most N rows.","explanationAr":"تُستخدم LIMIT N لتحديد عدد الصفوف الناتجة بـ N صف فقط.","lv":3},{"id":11,"questionEn":"What is the default sort order for ORDER BY if not specified?","questionAr":"ما هو ترتيب الفرز الافتراضي في ORDER BY إذا لم يُحدد؟","options":["DESC (Descending)","ASC (Ascending)","Random","By Primary Key"],"correctIndex":1,"explanationEn":"ORDER BY defaults to ASC (ascending from smallest to largest).","explanationAr":"ترتب ORDER BY تصاعدياً ASC تلقائياً من الأصغر إلى الأكبر.","lv":3},{"id":12,"questionEn":"Which SQL operator checks if a value falls inclusively within a range?","questionAr":"أي معامل يتحقق مما إذا كانت القيمة تقع ضمن نطاق محدد شاملاً الطرفين؟","options":["WITHIN","BETWEEN","RANGE","INSIDE"],"correctIndex":1,"explanationEn":"BETWEEN x AND y checks if a value is >= x and <= y inclusively.","explanationAr":"يتحقق المعامل BETWEEN x AND y مما إذا كانت القيمة محصورة بين الحدين وشاملة لهما.","lv":8},{"id":13,"questionEn":"Which aggregate function ignores NULL values?","questionAr":"أي من الدوال التجميعية التالية تتجاهل قيم NULL تلقائياً؟","options":["COUNT(col)","AVG(col)","SUM(col)","All of the above"],"correctIndex":3,"explanationEn":"All standard aggregate functions like SUM, AVG, and COUNT(column) ignore NULL values.","explanationAr":"جميع دوال التجميع القياسية مثل SUM و AVG و COUNT(column) تتجاهل قيم NULL تلقائياً.","lv":5},{"id":14,"questionEn":"What is the result of a CROSS JOIN between a table with 4 rows and a table with 5 rows?","questionAr":"ما عدد الصفوف الناتجة عن CROSS JOIN بين جدول به 4 صفوف وجدول به 5 صفوف؟","options":["9 rows","20 rows","1 row","5 rows"],"correctIndex":1,"explanationEn":"CROSS JOIN produces a Cartesian product: 4 * 5 = 20 rows.","explanationAr":"ينتج CROSS JOIN الضرب الديكارتي لجميع الاحتمالات: 4 × 5 = 20 صفاً.","lv":46},{"id":15,"questionEn":"Which clause is mandatory in a CASE expression?","questionAr":"ما هي الكلمة التي لا بد من إنهاء تعبير CASE بها في SQL؟","options":["FINISH","END","STOP","EXIT"],"correctIndex":1,"explanationEn":"Every CASE construct must conclude with the END keyword (often followed by AS alias).","explanationAr":"يجب دائماً إنهاء جملة CASE بالكلمة المفتاحية END متبوعة باسم العمود المستعار.","lv":16},{"id":16,"questionEn":"Which command completely deletes a table structure and all its data?","questionAr":"أي أمر يقوم بحذف بنية الجدول وبياناته بالكامل من قاعدة البيانات؟","options":["DELETE TABLE","DROP TABLE","REMOVE TABLE","TRUNCATE ONLY"],"correctIndex":1,"explanationEn":"DROP TABLE removes the entire table definition along with its indexes and data.","explanationAr":"يقوم أمر DROP TABLE بحذف الجدول بالكامل وتعريفه ومؤشراته من قاعدة البيانات.","lv":93},{"id":17,"questionEn":"Which wildcard in SQL LIKE matches exactly ONE single character?","questionAr":"أي رمز بديل في معامل LIKE يطابق حرفاً واحداً فقط بالضبط؟","options":["% (Percent)","_ (Underscore)","* (Asterisk)","? (Question mark)"],"correctIndex":1,"explanationEn":"Underscore (_) matches exactly one character, while % matches zero or more characters.","explanationAr":"يطابق الرمز الشرطة السفلية (_) حرفاً واحداً بالضبط، بينما يطابق % أي عدد من الأحرف.","lv":31},{"id":18,"questionEn":"What does the UNION operator do compared to UNION ALL?","questionAr":"ما الفرق بين UNION و UNION ALL عند دمج نتائج استعلامين؟","options":["UNION keeps all duplicates; UNION ALL removes them","UNION removes duplicate rows; UNION ALL keeps all duplicates","UNION only works on numbers","They are strictly identical"],"correctIndex":1,"explanationEn":"UNION executes a distinct deduplication pass, while UNION ALL simply appends results directly and faster.","explanationAr":"يقوم UNION بحذف الصفوف المكررة بينما يحتفظ UNION ALL بكافة الصفوف بما فيها التكرارات وهو أسرع.","lv":49},{"id":19,"questionEn":"Which window function clause divides the result set into independent partitions/buckets?","questionAr":"أي جملة في دوال النوافذ تُقسم البيانات إلى مجموعات أو نوافذ فرعية مستقلة؟","options":["GROUP BY","PARTITION BY","SPLIT BY","DIVIDE BY"],"correctIndex":1,"explanationEn":"OVER (PARTITION BY col) segments the rows into groups over which the window function operates.","explanationAr":"تُستخدم PARTITION BY داخل جملة OVER لتقسيم الصفوف إلى نوافذ فرعية يتم تطبيق الدالة عليها.","lv":20},{"id":20,"questionEn":"What is a correlated subquery in SQL?","questionAr":"ما هو الاستعلام الفرعي المرتبط (Correlated Subquery)؟","options":["A subquery that runs once before the outer query","A subquery that references columns from the outer query and evaluates row-by-row","A subquery that only joins two tables","A subquery written inside the FROM clause"],"correctIndex":1,"explanationEn":"A correlated subquery references values from the outer query for each evaluated row.","explanationAr":"هو استعلام فرعي يعتمد على قيم من الاستعلام الخارجي ويُعاد تقييمه لكل صف من صفوف الاستعلام الخارجي.","lv":21},{"id":21,"questionEn":"Which function converts a string to all uppercase letters?","questionAr":"ما الدالة القياسية التي تحول النص إلى حروف كبيرة (Uppercase)؟","options":["TO_UPPER()","UPPER()","CAPITALIZE()","BIG()"],"correctIndex":1,"explanationEn":"UPPER(text) returns the string with all characters converted to uppercase.","explanationAr":"تُرجع دالة UPPER(text) السلسلة النصية بحروف كبيرة كاملة.","lv":23},{"id":22,"questionEn":"What does COALESCE(val1, val2, val3) return?","questionAr":"ماذا تُرجع دالة COALESCE(val1, val2, val3) في SQL؟","options":["The maximum value","The first non-NULL value in the list","The average value","The count of items"],"correctIndex":1,"explanationEn":"COALESCE returns the very first non-NULL expression from its argument list.","explanationAr":"تُرجع دالة COALESCE أول قيمة غير فارغة (غير NULL) تصادفها في قائمة المعاملات.","lv":26},{"id":23,"questionEn":"What does the EXISTS operator return?","questionAr":"ما هي القيمة التي يُرجعها معامل EXISTS في SQL؟","options":["A table of rows","TRUE if the subquery returns at least one row, FALSE otherwise","The number of rows as an integer","The primary key of the match"],"correctIndex":1,"explanationEn":"EXISTS evaluates to TRUE as soon as the inner subquery returns at least 1 record.","explanationAr":"يُرجع EXISTS قيمة منطقية TRUE بمجرد أن يجد الاستعلام الفرعي صفاً واحداً على الأقل، و FALSE إذا كان فارغاً.","lv":54},{"id":24,"questionEn":"Which SQL clause is executed first logically in a query pipeline?","questionAr":"أي جملة تُنفذ منطقياً في البداية عند تشغيل استعلام SQL؟","options":["SELECT","WHERE","FROM","ORDER BY"],"correctIndex":2,"explanationEn":"The SQL engine first identifies the data source (FROM / JOIN), then WHERE, GROUP BY, HAVING, SELECT, and finally ORDER BY.","explanationAr":"يبدأ محرك SQL منطقياً بتحديد مصدر البيانات (FROM والربط)، ثم الشروط WHERE، ثم التجميع GROUP BY، ثم SELECT وأخيراً ORDER BY.","lv":7},{"id":25,"questionEn":"What is the primary key constraint used for?","questionAr":"ما هو الغرض الأساسي من قيد المفتاح الأساسي (PRIMARY KEY)؟","options":["To encrypt table data","To uniquely identify each record in a table without nulls","To speed up text translation","To allow duplicate values"],"correctIndex":1,"explanationEn":"PRIMARY KEY guarantees unique and non-null identification for every row in a relational table.","explanationAr":"يضمن المفتاح الأساسي تمييز كل صف في الجدول بشكل فريد مع منع القيم الفارغة NULL والتكرار.","lv":86},{"id":26,"questionEn":"What does this query return?","questionAr":"ما نتيجة هذا الاستعلام؟","sql":"SELECT hero_id FROM battles GROUP BY hero_id HAVING COUNT(*) >= 3 ORDER BY hero_id;","options":["1, 2, 8","1, 2, 3, 4, 8","2, 8","1"],"correctIndex":0,"explanationEn":"HAVING COUNT(*) >= 3 keeps heroes who fought at least 3 battles.","explanationAr":"الشرط HAVING COUNT(*) >= 3 يُبقي الأبطال الذين خاضوا 3 معارك على الأقل.","lv":60},{"id":27,"questionEn":"What does this query return?","questionAr":"ما نتيجة هذا الاستعلام؟","sql":"SELECT name, power * 2 AS double_power FROM heroes WHERE id = 1;","options":["Laila | 196","Tarek | 94","Tarek | 184","Tarek | 92"],"correctIndex":2,"explanationEn":"SQL can compute values on the fly, and AS only renames the output column.","explanationAr":"تستطيع SQL حساب القيم أثناء الاستعلام، والكلمة AS تغيّر اسم العمود في الناتج فقط.","lv":4},{"id":28,"questionEn":"What does this query return?","questionAr":"ما نتيجة هذا الاستعلام؟","sql":"SELECT COUNT(guild_id) FROM heroes;","options":["8","7","3","6"],"correctIndex":1,"explanationEn":"COUNT(column) skips NULL values. Ziad has no guild, so 7 of the 8 rows are counted.","explanationAr":"الدالة COUNT(عمود) تتجاهل قيم NULL. زياد بلا نقابة، فيُحسب 7 صفوف من 8.","lv":5},{"id":29,"questionEn":"Why use WHERE with DELETE?","questionAr":"لماذا نستخدم WHERE مع DELETE؟","options":["To choose which rows are removed","To make it faster only","To rename the table","It is required by the syntax"],"correctIndex":0,"explanationEn":"Without WHERE, DELETE removes every row.","explanationAr":"من غير WHERE يحذف DELETE كل الصفوف.","lv":15},{"id":30,"questionEn":"What does this query return?","questionAr":"ما نتيجة هذا الاستعلام؟","sql":"SELECT COUNT(*) FROM battles WHERE outcome = 'Win';","options":["12","16","4","7"],"correctIndex":0,"explanationEn":"WHERE filters before counting, so only the winning battles are counted.","explanationAr":"يصفّي WHERE قبل العدّ، فتُحسب المعارك الفائزة فقط.","lv":5},{"id":31,"questionEn":"How do you sort from the highest value to the lowest?","questionAr":"كيف ترتّب من الأكبر إلى الأصغر؟","options":["ORDER BY column DESC","ORDER BY column UP","ORDER column REVERSE","SORT column HIGH"],"correctIndex":0,"explanationEn":"DESC means descending. ASC (ascending) is the default.","explanationAr":"الكلمة DESC تعني تنازلياً، وASC (تصاعدي) هي الافتراضية.","lv":3},{"id":32,"questionEn":"What does this query return?","questionAr":"ما نتيجة هذا الاستعلام؟","sql":"SELECT MIN(founded_year), MAX(founded_year) FROM guilds;","options":["1151.25 | 4","1085 | 1210","1 | 4","1210 | 1085"],"correctIndex":1,"explanationEn":"MIN and MAX return the oldest and newest founding years, in the order they are written.","explanationAr":"الدالتان MIN وMAX تُرجعان أقدم سنة تأسيس وأحدثها بنفس ترتيب الكتابة.","lv":5},{"id":33,"questionEn":"Which function adds up all values of a numeric column?","questionAr":"أي دالة تجمع كل قيم عمود رقمي؟","options":["ADD","SUM","PLUS","TOTAL_ALL"],"correctIndex":1,"explanationEn":"SUM returns the total of the non-NULL values.","explanationAr":"الدالة SUM ترجع مجموع القيم غير NULL.","lv":5},{"id":34,"questionEn":"What does a database index mainly improve?","questionAr":"ما الذي يحسّنه فهرس قاعدة البيانات بشكل أساسي؟","options":["Storage space","Speed of searching","Column names","Password security"],"correctIndex":1,"explanationEn":"An index lets the engine find rows without scanning the whole table.","explanationAr":"الفهرس يتيح للمحرك إيجاد الصفوف دون مسح الجدول كله.","lv":92},{"id":35,"questionEn":"Which keyword gives a column or table a temporary new name in the result?","questionAr":"أي كلمة تعطي عموداً أو جدولاً اسماً مؤقتاً جديداً في النتيجة؟","options":["AS","NAME","RENAME","LABEL"],"correctIndex":0,"explanationEn":"AS creates an alias that exists only for that query.","explanationAr":"الكلمة AS تنشئ اسماً مستعاراً (Alias) يعيش داخل هذا الاستعلام فقط.","lv":4},{"id":36,"questionEn":"What does this query return?","questionAr":"ما نتيجة هذا الاستعلام؟","sql":"SELECT name FROM heroes WHERE NOT role = 'Warrior' ORDER BY id;","options":["Tarek, Mazen, Hamza, Noor, Ziad, Rana","Laila, Mazen, Salma, Noor, Ziad","Tarek, Laila, Salma, Hamza, Rana","Tarek, Hamza, Rana"],"correctIndex":1,"explanationEn":"NOT reverses the condition, so every hero who is not a Warrior is returned.","explanationAr":"العامل NOT يعكس الشرط فيُرجع كل بطل ليس Warrior.","lv":2},{"id":37,"questionEn":"What is a PRIMARY KEY column guaranteed NOT to contain?","questionAr":"ما الذي لا يمكن أن يحتويه عمود المفتاح الأساسي؟","options":["Text","Positive values","Duplicate values or NULL","Numbers"],"correctIndex":2,"explanationEn":"A primary key must be unique and not NULL so every row can be identified.","explanationAr":"المفتاح الأساسي يجب أن يكون فريداً وغير NULL حتى يمكن تحديد كل صف.","lv":86},{"id":38,"questionEn":"Which statement adds a new row to a table?","questionAr":"أي أمر يضيف صفاً جديداً إلى جدول؟","options":["INSERT INTO","ADD ROW","PUT INTO","APPEND TABLE"],"correctIndex":0,"explanationEn":"INSERT INTO table (columns) VALUES (...) creates a new row.","explanationAr":"الأمر INSERT INTO جدول (الأعمدة) VALUES (...) ينشئ صفاً جديداً.","lv":13},{"id":39,"questionEn":"What does this query return?","questionAr":"ما نتيجة هذا الاستعلام؟","sql":"SELECT COUNT(*) FROM heroes WHERE level >= 5 AND guild_id IS NOT NULL;","options":["7","6","1","5"],"correctIndex":1,"explanationEn":"IS NOT NULL removes heroes without a guild before counting.","explanationAr":"الشرط IS NOT NULL يستبعد الأبطال بلا نقابة قبل العدّ.","lv":2},{"id":40,"questionEn":"Which statement changes values in existing rows?","questionAr":"أي أمر يغيّر قيماً في صفوف موجودة؟","options":["MODIFY ... TO","UPDATE ... SET","ALTER ROW","CHANGE ... WITH"],"correctIndex":1,"explanationEn":"UPDATE table SET column = value WHERE ... edits existing rows.","explanationAr":"الأمر UPDATE جدول SET عمود = قيمة WHERE ... يعدّل الصفوف الموجودة.","lv":14},{"id":41,"questionEn":"Which data type is best for a person's age?","questionAr":"أي نوع بيانات الأنسب لعمر شخص؟","options":["TEXT","BLOB","DATE","INTEGER"],"correctIndex":3,"explanationEn":"Whole numbers fit INTEGER, which also allows math and comparisons.","explanationAr":"الأعداد الصحيحة تناسب INTEGER وتسمح بالحساب والمقارنة.","lv":86},{"id":42,"questionEn":"Why do we write a semicolon at the end of a statement?","questionAr":"لماذا نكتب الفاصلة المنقوطة في نهاية الأمر؟","options":["To make it case-sensitive","To mark the end of the statement","To comment it out","To make it run faster"],"correctIndex":1,"explanationEn":"The semicolon separates one statement from the next.","explanationAr":"الفاصلة المنقوطة تفصل أمراً عن الذي يليه.","lv":1},{"id":43,"questionEn":"What does OFFSET 3 do?","questionAr":"ماذا يفعل OFFSET 3؟","options":["Returns only 3 rows","Skips the first 3 rows","Adds 3 to every value","Starts counting at row 3 of the table file"],"correctIndex":1,"explanationEn":"OFFSET is used with LIMIT for pagination.","explanationAr":"يُستخدم OFFSET مع LIMIT لتقسيم النتائج إلى صفحات.","lv":3},{"id":44,"questionEn":"What is NULL in SQL?","questionAr":"ما هي NULL في SQL؟","options":["An empty string","The word false","The number zero","An unknown or missing value"],"correctIndex":3,"explanationEn":"NULL is not 0 and not ''. It represents the absence of a value.","explanationAr":"القيمة NULL ليست 0 وليست نصاً فارغاً، بل غياب القيمة.","lv":2},{"id":45,"questionEn":"What does this query return?","questionAr":"ما نتيجة هذا الاستعلام؟","sql":"SELECT SUBSTR(guild_name, 1, 5) FROM guilds WHERE id = 1;","options":["astle","Castle","uards","Castl"],"correctIndex":3,"explanationEn":"SUBSTR(text, start, length) starts counting at position 1.","explanationAr":"الدالة SUBSTR(نص, بداية, طول) تبدأ العدّ من الموضع 1.","lv":23},{"id":46,"questionEn":"What does this query return?","questionAr":"ما نتيجة هذا الاستعلام؟","sql":"SELECT role, COUNT(*) FROM heroes GROUP BY role ORDER BY role;","options":["Archer | 79; Healer | 88; Mage | 98; Warrior | 94","Warrior | 3; Archer | 2; Mage | 2; Healer | 1","Archer | 11; Healer | 9; Mage | 17; Warrior | 21","Archer | 2; Healer | 1; Mage | 2; Warrior | 3"],"correctIndex":3,"explanationEn":"GROUP BY makes one row per role, and COUNT(*) counts the heroes inside each group.","explanationAr":"الأمر GROUP BY ينتج صفاً لكل دور، والدالة COUNT(*) تعدّ الأبطال داخل كل مجموعة.","lv":6},{"id":47,"questionEn":"What does this query return?","questionAr":"ما نتيجة هذا الاستعلام؟","sql":"SELECT MAX(power) FROM heroes;","options":["84.875","68","10","98"],"correctIndex":3,"explanationEn":"MAX returns the largest value in the column. Laila has the highest power, 98.","explanationAr":"الدالة MAX تُرجع أكبر قيمة في العمود، وأعلى قوة هي 98 عند ليلى.","lv":5},{"id":48,"questionEn":"What does this query return?","questionAr":"ما نتيجة هذا الاستعلام؟","sql":"SELECT LENGTH(guild_name) FROM guilds WHERE id = 2;","options":["6","12","14","13"],"correctIndex":3,"explanationEn":"LENGTH counts characters, spaces included. 'Crystal Sages' has 13.","explanationAr":"الدالة LENGTH تعدّ الأحرف بما فيها المسافات، و'Crystal Sages' فيها 13 حرفاً.","lv":23},{"id":49,"questionEn":"What does this query return?","questionAr":"ما نتيجة هذا الاستعلام؟","sql":"SELECT DISTINCT role FROM heroes ORDER BY role;","options":["Archer, Archer, Healer, Mage, Mage, Warrior, Warrior, Warrior","Warrior, Mage, Healer, Archer","Archer, Healer, Mage, Warrior","4"],"correctIndex":2,"explanationEn":"DISTINCT removes duplicates, so each role appears once, in alphabetical order.","explanationAr":"الكلمة DISTINCT تحذف التكرار فيظهر كل دور مرة واحدة بترتيب أبجدي.","lv":4},{"id":50,"questionEn":"A table in a relational database is made of:","questionAr":"الجدول في قاعدة البيانات العلائقية يتكوّن من:","options":["Rows (records) and columns (fields)","Files and folders","Only rows with no names","Loops and functions"],"correctIndex":0,"explanationEn":"Each row is one record and each column is one attribute of it.","explanationAr":"كل صف سجل واحد وكل عمود خاصية من خواصه.","lv":1},{"id":51,"questionEn":"What does this query return?","questionAr":"ما نتيجة هذا الاستعلام؟","sql":"SELECT name FROM heroes WHERE level BETWEEN 5 AND 8 ORDER BY id;","options":["Tarek, Salma, Noor, Ziad, Rana","Tarek, Mazen, Salma, Ziad","Mazen, Salma, Ziad","Salma, Ziad"],"correctIndex":1,"explanationEn":"BETWEEN includes both ends, so levels 5, 6, 7 and 8 all match.","explanationAr":"العامل BETWEEN يشمل الطرفين، فتتطابق المستويات 5 و6 و7 و8.","lv":8},{"id":52,"questionEn":"What does this query return?","questionAr":"ما نتيجة هذا الاستعلام؟","sql":"SELECT name FROM heroes WHERE level > 8 AND (role = 'Mage' OR role = 'Warrior') ORDER BY id;","options":["Laila, Rana","Noor","Tarek, Laila, Hamza, Rana","Laila, Noor, Rana"],"correctIndex":0,"explanationEn":"Parentheses control the order. AND is evaluated before OR, so without them the result changes.","explanationAr":"الأقواس تتحكم في الترتيب، فالعامل AND يُقيَّم قبل OR وبدونها تتغير النتيجة.","lv":32},{"id":53,"questionEn":"Which function finds the smallest value in a column?","questionAr":"أي دالة تجد أصغر قيمة في عمود؟","options":["SMALLEST","MIN","LOW","BOTTOM"],"correctIndex":1,"explanationEn":"MIN returns the smallest value.","explanationAr":"الدالة MIN ترجع أصغر قيمة.","lv":5},{"id":54,"questionEn":"What does SQL stand for?","questionAr":"ماذا تعني SQL؟","options":["Simple Question Logic","Stored Query List","Sequential Query Layer","Structured Query Language"],"correctIndex":3,"explanationEn":"SQL is short for Structured Query Language, the standard language for relational databases.","explanationAr":"SQL اختصار Structured Query Language، وهي اللغة القياسية لقواعد البيانات العلائقية.","lv":1},{"id":55,"questionEn":"What is a FOREIGN KEY used for?","questionAr":"فيمَ يُستخدم المفتاح الأجنبي FOREIGN KEY؟","options":["Sorting a table","Encrypting a column","Linking a row to a row in another table","Speeding up COUNT"],"correctIndex":2,"explanationEn":"It stores the primary key of another table, creating a relationship.","explanationAr":"يخزّن المفتاح الأساسي لجدول آخر فينشئ علاقة بين الجدولين.","lv":88},{"id":56,"questionEn":"Which is the correct order of clauses in a query?","questionAr":"ما الترتيب الصحيح للجمل في الاستعلام؟","options":["FROM, SELECT, ORDER BY, WHERE, GROUP BY, HAVING","SELECT, FROM, WHERE, GROUP BY, HAVING, ORDER BY","SELECT, WHERE, FROM, HAVING, GROUP BY, ORDER BY","WHERE, SELECT, FROM, GROUP BY, ORDER BY, HAVING"],"correctIndex":1,"explanationEn":"This is the order you must WRITE them in, even though the engine runs them differently.","explanationAr":"هذا ترتيب كتابتها، رغم أن المحرك ينفذها بترتيب مختلف.","lv":7},{"id":57,"questionEn":"Which condition is correct to find rows where gold is between 100 and 200 including both ends?","questionAr":"أي شرط صحيح لإيجاد الصفوف التي الذهب فيها بين 100 و200 شاملاً الطرفين؟","options":["gold BETWEEN 100 AND 200","gold > 100 AND gold < 200","gold = 100 TO 200","gold IN (100, 200)"],"correctIndex":0,"explanationEn":"BETWEEN is inclusive. IN (100, 200) would match only those two exact values.","explanationAr":"العامل BETWEEN شامل للطرفين، أما IN (100, 200) فيطابق القيمتين فقط.","lv":8},{"id":58,"questionEn":"Which statement adds a new column to an existing table?","questionAr":"أي أمر يضيف عموداً جديداً لجدول موجود؟","options":["UPDATE TABLE ... ADD","ALTER TABLE ... ADD COLUMN","INSERT COLUMN","CHANGE TABLE ADD"],"correctIndex":1,"explanationEn":"ALTER TABLE changes the structure of a table.","explanationAr":"الأمر ALTER TABLE يغيّر بنية الجدول.","lv":89},{"id":59,"questionEn":"What does this query return?","questionAr":"ما نتيجة هذا الاستعلام؟","sql":"SELECT region, COUNT(*) FROM enemies GROUP BY region HAVING COUNT(*) > 1 ORDER BY region;","options":["(no rows)","Athena | 1; North Keep | 1; Sun Oasis | 2; Whispering Woods | 2","Sun Oasis | 2; Whispering Woods | 2","Sun Oasis | 550; Whispering Woods | 570"],"correctIndex":2,"explanationEn":"Only regions that hold more than one enemy survive the HAVING filter.","explanationAr":"تبقى بعد HAVING المناطق التي فيها أكثر من عدو فقط.","lv":60},{"id":60,"questionEn":"What does this query return?","questionAr":"ما نتيجة هذا الاستعلام؟","sql":"SELECT role, MAX(power) FROM heroes GROUP BY role HAVING COUNT(*) > 2;","options":["Warrior | 68","Archer | 79; Mage | 98; Warrior | 94","Mage | 98; Warrior | 94","Warrior | 94"],"correctIndex":3,"explanationEn":"HAVING filters groups after aggregation. Only Warrior has more than 2 heroes, and its top power is 94.","explanationAr":"الشرط HAVING يصفّي المجموعات بعد التجميع، ودور Warrior وحده فيه أكثر من بطلين وأعلى قوة فيه 94.","lv":60},{"id":61,"questionEn":"What does this query return?","questionAr":"ما نتيجة هذا الاستعلام؟","sql":"SELECT SUM(qty) FROM inventory WHERE item_id = 4;","options":["35","5","10","28"],"correctIndex":3,"explanationEn":"SUM adds the quantities of Mana Potions held by all heroes: 5+8+2+10+3.","explanationAr":"الدالة SUM تجمع كميات جرعات المانا عند كل الأبطال: 5+8+2+10+3.","lv":5},{"id":62,"questionEn":"What does this query return?","questionAr":"ما نتيجة هذا الاستعلام؟","sql":"SELECT ROUND(AVG(power), 1) FROM heroes;","options":["84.88","85","84.875","84.9"],"correctIndex":3,"explanationEn":"ROUND(x, 1) keeps one digit after the decimal point.","explanationAr":"الدالة ROUND(x, 1) تُبقي رقماً واحداً بعد الفاصلة.","lv":28},{"id":63,"questionEn":"What does this query return?","questionAr":"ما نتيجة هذا الاستعلام؟","sql":"SELECT name FROM heroes WHERE gold > 500 ORDER BY gold;","options":["Tarek, Noor, Rana, Laila","Laila, Noor, Rana","Noor, Rana, Laila","Laila, Rana, Noor"],"correctIndex":2,"explanationEn":"Rows are filtered first (gold above 500), then sorted ascending by gold.","explanationAr":"تُصفّى الصفوف أولاً (الذهب أكبر من 500) ثم تُرتَّب تصاعدياً حسب الذهب.","lv":3},{"id":64,"questionEn":"What does SELECT * FROM heroes; return?","questionAr":"ماذا يُرجع الاستعلام SELECT * FROM heroes;؟","options":["Only the column names of heroes","All columns of all rows in heroes","Only the first row of heroes","The number of rows in heroes"],"correctIndex":1,"explanationEn":"The * means every column, and with no WHERE every row is returned.","explanationAr":"الرمز * يعني كل الأعمدة، ومن غير WHERE تُرجَع كل الصفوف.","lv":1},{"id":65,"questionEn":"What does this query return?","questionAr":"ما نتيجة هذا الاستعلام؟","sql":"SELECT name FROM heroes WHERE name LIKE '%a%' ORDER BY name;","options":["Hamza, Laila, Rana, Salma","Hamza, Laila, Mazen, Rana, Salma, Tarek, Ziad","Hamza, Laila, Mazen, Rana, Salma, Tarek","(no rows)"],"correctIndex":1,"explanationEn":"%a% matches names containing the letter a anywhere. LIKE ignores letter case for ASCII in SQLite.","explanationAr":"النمط %a% يطابق الأسماء التي بها حرف a في أي موضع، وفي SQLite لا يفرّق LIKE بين الحروف الكبيرة والصغيرة.","lv":31},{"id":66,"questionEn":"Which symbol is the SQL concatenation operator in SQLite?","questionAr":"ما رمز دمج النصوص في SQLite؟","options":["&&","+","&","||"],"correctIndex":3,"explanationEn":"|| joins two strings together.","explanationAr":"الرمز || يدمج نصين معاً.","lv":23},{"id":67,"questionEn":"What does this query return?","questionAr":"ما نتيجة هذا الاستعلام؟","sql":"SELECT AVG(level) FROM heroes;","options":["58","84.875","7.25","10"],"correctIndex":2,"explanationEn":"AVG divides the sum of levels (58) by the number of rows (8).","explanationAr":"الدالة AVG تقسم مجموع المستويات (58) على عدد الصفوف (8).","lv":5},{"id":68,"questionEn":"Which clause sorts the result rows?","questionAr":"أي جملة ترتّب صفوف النتيجة؟","options":["SORT BY","ARRANGE","ORDER BY","GROUP BY"],"correctIndex":2,"explanationEn":"ORDER BY sorts the output, ascending by default.","explanationAr":"الجملة ORDER BY ترتّب الناتج تصاعدياً افتراضياً.","lv":3},{"id":69,"questionEn":"What does this query return?","questionAr":"ما نتيجة هذا الاستعلام؟","sql":"SELECT COUNT(*) FROM heroes;","options":["5","8","4","7"],"correctIndex":1,"explanationEn":"COUNT(*) counts every row, including rows with NULLs. The heroes table has 8 rows.","explanationAr":"الدالة COUNT(*) تعدّ كل الصفوف حتى التي بها قيم NULL، وجدول heroes فيه 8 صفوف.","lv":5},{"id":70,"questionEn":"What does this query return?","questionAr":"ما نتيجة هذا الاستعلام؟","sql":"SELECT item_name FROM items WHERE rarity != 'Common' ORDER BY price LIMIT 1;","options":["Mana Potion","Staff of Wisdom","Wind Bow","Thunder Blade"],"correctIndex":2,"explanationEn":"Filter out Common items first, then take the cheapest of what is left.","explanationAr":"نستبعد العناصر Common أولاً ثم نأخذ الأرخص من الباقي.","lv":3},{"id":71,"questionEn":"What does this query return?","questionAr":"ما نتيجة هذا الاستعلام؟","sql":"SELECT hero_id, SUM(damage) FROM battles GROUP BY hero_id ORDER BY SUM(damage) DESC LIMIT 1;","options":["8 | 700","1 | 4","5 | 60","2 | 1410"],"correctIndex":3,"explanationEn":"Group per hero, add up the damage, sort from high to low, and keep the first row.","explanationAr":"نجمّع لكل بطل ونجمع الضرر ونرتّب من الأعلى للأدنى ونأخذ أول صف.","lv":6},{"id":72,"questionEn":"What does this query return?","questionAr":"ما نتيجة هذا الاستعلام؟","sql":"SELECT COUNT(DISTINCT hero_id) FROM inventory;","options":["12","6","5","7"],"correctIndex":3,"explanationEn":"COUNT(DISTINCT ...) counts unique values only, so each hero is counted once.","explanationAr":"الدالة COUNT(DISTINCT ...) تعدّ القيم الفريدة فقط، فيُحسب كل بطل مرة واحدة.","lv":56},{"id":73,"questionEn":"In SELECT role, COUNT(*) FROM heroes GROUP BY role, what does GROUP BY do?","questionAr":"في الاستعلام SELECT role, COUNT(*) FROM heroes GROUP BY role ماذا يفعل GROUP BY؟","options":["Sorts the roles alphabetically","Removes the role column","Puts rows with the same role into one group","Joins the table to itself"],"correctIndex":2,"explanationEn":"Aggregates like COUNT are then calculated once per group.","explanationAr":"تُحسب دوال التجميع مثل COUNT مرة لكل مجموعة.","lv":6},{"id":74,"questionEn":"Which is true about SQL keywords such as SELECT and select?","questionAr":"أي عبارة صحيحة عن كلمات SQL مثل SELECT وselect؟","options":["They are case-insensitive","They mean different things","Only lowercase works","Only uppercase works"],"correctIndex":0,"explanationEn":"Keywords are case-insensitive. Uppercase is just a readability convention.","explanationAr":"الكلمات المفتاحية غير حساسة لحالة الأحرف، والكتابة بالكبير للتنظيم فقط.","lv":1},{"id":75,"questionEn":"What does this query return?","questionAr":"ما نتيجة هذا الاستعلام؟","sql":"SELECT item_name FROM items WHERE category IN ('Armor', 'Potion') ORDER BY id;","options":["Phoenix Shield, Mana Potion","Phoenix Shield","Thunder Blade, Staff of Wisdom, Mana Potion, Wind Bow","Thunder Blade, Staff of Wisdom, Wind Bow"],"correctIndex":0,"explanationEn":"IN matches any value in the list, like several OR conditions.","explanationAr":"العامل IN يطابق أي قيمة من القائمة، مثل عدة شروط OR.","lv":8},{"id":76,"questionEn":"What does this query return?","questionAr":"ما نتيجة هذا الاستعلام؟","sql":"SELECT name FROM heroes ORDER BY power DESC LIMIT 3;","options":["Laila, Noor, Rana","Laila, Rana, Tarek","Hamza, Mazen, Ziad","Tarek"],"correctIndex":1,"explanationEn":"Sort by power from high to low, then LIMIT keeps only the first 3 rows.","explanationAr":"نرتّب حسب القوة من الأعلى للأدنى ثم يُبقي LIMIT أول 3 صفوف فقط.","lv":3},{"id":77,"questionEn":"Which function returns the number of characters in a text?","questionAr":"أي دالة ترجع عدد أحرف نص؟","options":["SIZE","LEN_OF","COUNT_CHARS","LENGTH"],"correctIndex":3,"explanationEn":"LENGTH('SQL') is 3.","explanationAr":"LENGTH('SQL') تساوي 3.","lv":23},{"id":78,"questionEn":"What does this query return?","questionAr":"ما نتيجة هذا الاستعلام؟","sql":"SELECT item_name FROM items ORDER BY price DESC LIMIT 2 OFFSET 1;","options":["Staff of Wisdom, Thunder Blade","Thunder Blade, Phoenix Shield","Phoenix Shield, Wind Bow","Wind Bow, Phoenix Shield"],"correctIndex":1,"explanationEn":"OFFSET 1 skips the most expensive item, then LIMIT 2 takes the next two.","explanationAr":"الأمر OFFSET 1 يتخطى أغلى عنصر ثم يأخذ LIMIT 2 العنصرين التاليين.","lv":3},{"id":79,"questionEn":"Which statement creates a new table?","questionAr":"أي أمر ينشئ جدولاً جديداً؟","options":["CREATE TABLE","NEW TABLE","BUILD TABLE","MAKE TABLE"],"correctIndex":0,"explanationEn":"CREATE TABLE defines the columns and their types.","explanationAr":"الأمر CREATE TABLE يعرّف الأعمدة وأنواعها.","lv":86},{"id":80,"questionEn":"What does this query return?","questionAr":"ما نتيجة هذا الاستعلام؟","sql":"SELECT enemy_name FROM enemies WHERE hp > 300 AND region = 'Sun Oasis';","options":["Frost Dragon, Bone Soldier, Sand Wraith, Forest Troll, Storm Drake","Sand Wraith","Frost Dragon, Sand Wraith, Forest Troll, Storm Drake","Bone Soldier, Sand Wraith"],"correctIndex":1,"explanationEn":"AND needs both conditions to be true for the same row.","explanationAr":"العامل AND يتطلب تحقق الشرطين معاً في نفس الصف.","lv":2},{"id":81,"questionEn":"What does this query return?","questionAr":"ما نتيجة هذا الاستعلام؟","sql":"SELECT name FROM heroes WHERE guild_id IS NULL;","options":["Ziad","(no rows)","Tarek, Laila, Mazen, Salma, Hamza, Noor, Rana","Hamza"],"correctIndex":0,"explanationEn":"NULL must be tested with IS NULL. Comparing with = NULL never matches any row.","explanationAr":"قيمة NULL تُفحص بـ IS NULL فقط، أما المقارنة بـ = NULL فلا تطابق أي صف.","lv":2},{"id":82,"questionEn":"What does this query return?","questionAr":"ما نتيجة هذا الاستعلام؟","sql":"SELECT outcome, COUNT(*) FROM battles GROUP BY outcome ORDER BY outcome;","options":["Loss | 4; Win | 12","Loss | 1200; Win | 3675","Loss | 700; Win | 640","Loss | 300; Win | 306.25"],"correctIndex":0,"explanationEn":"One row per outcome value, with the number of battles in each.","explanationAr":"صف لكل قيمة نتيجة مع عدد المعارك فيها.","lv":6},{"id":83,"questionEn":"What does this query return?","questionAr":"ما نتيجة هذا الاستعلام؟","sql":"SELECT type, AVG(hp) FROM enemies GROUP BY type ORDER BY type;","options":["Beast | 450; Dragon | 900; Undead | 310","Beast | 120; Dragon | 700; Undead | 240","Beast | 570; Dragon | 1600; Undead | 550","Beast | 285; Dragon | 800; Undead | 275"],"correctIndex":3,"explanationEn":"AVG is calculated separately inside each group.","explanationAr":"تُحسب الدالة AVG بشكل منفصل داخل كل مجموعة.","lv":6},{"id":84,"questionEn":"Which operator combines conditions so that ALL of them must be true?","questionAr":"أي عامل يجمع شروطاً بحيث يجب تحققها كلها؟","options":["XOR","OR","NOT","AND"],"correctIndex":3,"explanationEn":"AND is true only if both sides are true.","explanationAr":"العامل AND صحيح فقط لو الطرفان صحيحان.","lv":2},{"id":85,"questionEn":"Which JOIN returns only the rows that have a match in BOTH tables?","questionAr":"أي ربط يُرجع الصفوف التي لها مطابقة في الجدولين فقط؟","options":["CROSS JOIN","LEFT JOIN","SELF JOIN","INNER JOIN"],"correctIndex":3,"explanationEn":"INNER JOIN drops rows that have no partner on the other side.","explanationAr":"الربط INNER JOIN يستبعد الصفوف التي لا يقابلها صف في الجدول الآخر.","lv":9},{"id":86,"questionEn":"How do you write a single-line comment in SQL?","questionAr":"كيف تكتب تعليقاً في سطر واحد في SQL؟","options":["-- comment","# comment","<!-- comment -->","// comment"],"correctIndex":0,"explanationEn":"Everything after -- until the end of the line is ignored.","explanationAr":"كل ما بعد -- حتى نهاية السطر يُتجاهل.","lv":1},{"id":87,"questionEn":"What does SELECT NULL = NULL return?","questionAr":"ماذا يُرجع SELECT NULL = NULL؟","options":["NULL (unknown)","1 (true)","An error","0 (false)"],"correctIndex":0,"explanationEn":"Any comparison with NULL is unknown. That is why IS NULL exists.","explanationAr":"أي مقارنة مع NULL نتيجتها مجهولة، ولهذا وُجد IS NULL.","lv":2},{"id":88,"questionEn":"What does this query return?","questionAr":"ما نتيجة هذا الاستعلام؟","sql":"SELECT COUNT(*) FROM heroes WHERE gold > 400 AND power < 95;","options":["3","1","8","4"],"correctIndex":0,"explanationEn":"Both conditions must hold for the same hero before the row is counted.","explanationAr":"يجب أن يتحقق الشرطان في نفس البطل حتى يُعدّ الصف.","lv":2},{"id":89,"questionEn":"What does this query return?","questionAr":"ما نتيجة هذا الاستعلام؟","sql":"SELECT name FROM heroes WHERE role = 'Mage';","options":["Laila","Noor","Laila, Salma","Laila, Salma, Noor"],"correctIndex":2,"explanationEn":"WHERE keeps only rows that match the condition. Two heroes have the role Mage.","explanationAr":"الشرط WHERE يُبقي الصفوف المطابقة فقط، وبطلان فقط دورهما Mage.","lv":2},{"id":90,"questionEn":"Which operator is true if AT LEAST ONE condition is true?","questionAr":"أي عامل يكون صحيحاً لو تحقق شرط واحد على الأقل؟","options":["ALL","OR","AND","BOTH"],"correctIndex":1,"explanationEn":"OR needs only one side to be true.","explanationAr":"العامل OR يكفيه تحقق أحد الطرفين.","lv":2},{"id":91,"questionEn":"What does this query return?","questionAr":"ما نتيجة هذا الاستعلام؟","sql":"SELECT name FROM heroes WHERE name LIKE '_a%' ORDER BY id;","options":["Laila, Salma, Hamza, Rana","Salma","Tarek, Laila, Mazen, Salma, Hamza, Rana","(no rows)"],"correctIndex":2,"explanationEn":"_ matches exactly one character, so '_a%' means: any first letter, then a.","explanationAr":"الرمز _ يطابق حرفاً واحداً بالضبط، فالنمط '_a%' يعني أي حرف أول ثم a.","lv":31},{"id":92,"questionEn":"What is the result of 7 / 2 in SQLite when both numbers are integers?","questionAr":"ما نتيجة 7 / 2 في SQLite لو الرقمان صحيحان؟","options":["3.5","3","2","4"],"correctIndex":1,"explanationEn":"Integer division drops the fraction. Use 7 / 2.0 to get 3.5.","explanationAr":"القسمة بين صحيحين تحذف الكسر، واستخدم 7 / 2.0 للحصول على 3.5.","lv":28},{"id":93,"questionEn":"What does a string in SQL need around it?","questionAr":"ماذا تحتاج القيمة النصية في SQL حولها؟","options":["Square brackets: [text]","Nothing at all","Hash signs: #text#","Single quotes: 'text'"],"correctIndex":3,"explanationEn":"Text literals use single quotes.","explanationAr":"القيم النصية تُكتب بين علامتي اقتباس مفردتين.","lv":1},{"id":94,"questionEn":"Which statement removes rows from a table but keeps the table itself?","questionAr":"أي أمر يحذف صفوفاً من جدول ويُبقي الجدول نفسه؟","options":["DELETE FROM","DROP TABLE","CLEAR STRUCTURE","REMOVE TABLE"],"correctIndex":0,"explanationEn":"DELETE FROM removes rows (use WHERE to choose which). DROP TABLE removes the table itself.","explanationAr":"الأمر DELETE FROM يحذف صفوفاً (استخدم WHERE لتحديدها)، أما DROP TABLE فيحذف الجدول نفسه.","lv":15},{"id":95,"questionEn":"What does LIMIT 5 do?","questionAr":"ماذا يفعل LIMIT 5؟","options":["Returns exactly 5 columns","Returns at most 5 rows","Deletes 5 rows","Skips the first 5 rows"],"correctIndex":1,"explanationEn":"LIMIT caps the number of rows in the result.","explanationAr":"الأمر LIMIT يحدّد أقصى عدد من الصفوف في النتيجة.","lv":3},{"id":96,"questionEn":"What does this query return?","questionAr":"ما نتيجة هذا الاستعلام؟","sql":"SELECT SUM(reward) FROM quests WHERE status = 'Completed';","options":["1620","1920","324","300"],"correctIndex":0,"explanationEn":"WHERE runs before SUM, so only completed quests are added: 200+450+120+600+250.","explanationAr":"يعمل WHERE قبل SUM فتُجمع المهام المكتملة فقط: 200+450+120+600+250.","lv":5},{"id":97,"questionEn":"What does this query return?","questionAr":"ما نتيجة هذا الاستعلام؟","sql":"SELECT title FROM quests WHERE reward >= 300 ORDER BY reward;","options":["Border Village Rescue, Ancient Scroll Cipher, Frost Dragon Battle","Frost Dragon Battle, Ancient Scroll Cipher, Border Village Rescue","Ancient Scroll Cipher, Frost Dragon Battle","Forest Recon, Caravan Escort, Sanctuary Healing"],"correctIndex":0,"explanationEn":">= includes the boundary value 300, while > excludes it.","explanationAr":"العامل >= يشمل القيمة الحدّية 300 بينما > يستثنيها.","lv":3},{"id":98,"questionEn":"What does this query return?","questionAr":"ما نتيجة هذا الاستعلام؟","sql":"SELECT MAX(damage) - MIN(damage) FROM battles;","options":["640","700","304.6875","4875"],"correctIndex":0,"explanationEn":"Aggregate results can be used in arithmetic: 700 minus 60.","explanationAr":"يمكن استخدام نتائج دوال التجميع في العمليات الحسابية: 700 ناقص 60.","lv":5},{"id":99,"questionEn":"What does this query return?","questionAr":"ما نتيجة هذا الاستعلام؟","sql":"SELECT UPPER(name) FROM heroes WHERE id <= 2 ORDER BY id;","options":["T, L","TAREK, LAILA","5, 5","tarek, laila"],"correctIndex":1,"explanationEn":"UPPER converts text to capital letters.","explanationAr":"الدالة UPPER تحوّل النص إلى أحرف كبيرة.","lv":23},{"id":100,"questionEn":"What does this query return?","questionAr":"ما نتيجة هذا الاستعلام؟","sql":"SELECT name || ' (' || role || ')' FROM heroes WHERE id = 3;","options":["0","Mazen | Archer","Mazen (Archer)","ArcherMazen"],"correctIndex":2,"explanationEn":"|| joins text in SQLite. The + operator is for numbers, so it turns the text into 0.","explanationAr":"العامل || يدمج النصوص في SQLite، أما + فللأرقام فيحوّل النص إلى 0.","lv":23}],"reference":[{"titleEn":"Selecting Columns & Distinct Values","titleAr":"استرجاع الأعمدة والقيم الفريدة (SELECT & DISTINCT)","levelEn":"Beginner","levelAr":"مبتدئ","descriptionEn":"SELECT retrieves specific columns or all columns (*) from a table. DISTINCT eliminates duplicate values.","descriptionAr":"يُستخدم SELECT لاختيار أعمدة محددة أو جميع الأعمدة (*) من الجدول، وتحذف DISTINCT التكرارات.","sampleSql":"SELECT DISTINCT role FROM heroes;"},{"titleEn":"Filtering with WHERE & Operators","titleAr":"تصفية البيانات بالشروط (WHERE, BETWEEN, IN, LIKE)","levelEn":"Beginner","levelAr":"مبتدئ","descriptionEn":"Filter rows using comparison operators, logical AND/OR, set membership (IN), ranges (BETWEEN), or pattern matching (LIKE).","descriptionAr":"تصفية الصفوف باستخدام المعاملات المنطقية AND و OR ومطابقة القوائم IN والنطاقات BETWEEN والأنماط LIKE.","sampleSql":"SELECT name, role, power FROM heroes WHERE power BETWEEN 75 AND 95 AND role IN ('Mage', 'Warrior');"},{"titleEn":"Sorting & Limiting (ORDER BY & LIMIT)","titleAr":"الترتيب وتحديد عدد النتائج (ORDER BY & LIMIT)","levelEn":"Beginner","levelAr":"مبتدئ","descriptionEn":"ORDER BY sorts rows ascending (ASC) or descending (DESC). LIMIT caps the number of output rows.","descriptionAr":"يرتب ORDER BY النتائج تصاعدياً أو تنازلياً DESC، ويحدد LIMIT الحد الأقصى لعدد النتائج.","sampleSql":"SELECT name, gold FROM heroes ORDER BY gold DESC LIMIT 4;"},{"titleEn":"Aggregates (COUNT, SUM, AVG, MIN, MAX)","titleAr":"دوال التجميع الإحصائية (COUNT, SUM, AVG, MIN, MAX)","levelEn":"Intermediate","levelAr":"متوسط","descriptionEn":"Compute summary metrics across multiple rows such as counts, sums, averages, and extremes.","descriptionAr":"تُجري عمليات حسابية على مجموعة من الصفوف لإنتاج ملخص إحصائي دقيق.","sampleSql":"SELECT COUNT(*) AS total_count, AVG(power) AS avg_power, SUM(gold) AS total_gold FROM heroes;"},{"titleEn":"Grouping & Group Filtering (GROUP BY & HAVING)","titleAr":"التجميع وتصفية المجموعات (GROUP BY & HAVING)","levelEn":"Intermediate","levelAr":"متوسط","descriptionEn":"GROUP BY buckets rows by category; HAVING filters groups based on aggregate computations.","descriptionAr":"تُجمع GROUP BY الصفوف حسب الفئة، وتصفي HAVING المجموعات بناءً على نتائج دوال التجميع.","sampleSql":"SELECT role, COUNT(*) AS cnt, AVG(power) AS avg_power FROM heroes GROUP BY role HAVING COUNT(*) >= 2;"},{"titleEn":"Relational Joins (INNER JOIN & LEFT JOIN)","titleAr":"ربط الجداول العلائقية (INNER JOIN & LEFT JOIN)","levelEn":"Advanced","levelAr":"متقدم","descriptionEn":"INNER JOIN returns matching rows between tables; LEFT JOIN preserves all left-table rows with NULLs for unmatched right rows.","descriptionAr":"يدمج INNER JOIN الصفوف المتطابقة في الجدولين، بينما يحتفظ LEFT JOIN بجميع صفوف الجدول الأيسر.","sampleSql":"SELECT h.name, h.role, g.guild_name, g.city FROM heroes h LEFT JOIN guilds g ON h.guild_id = g.id;"},{"titleEn":"Conditional Expressions (CASE WHEN)","titleAr":"المنطق الشرطي داخل الاستعلام (CASE WHEN)","levelEn":"Advanced","levelAr":"متقدم","descriptionEn":"Evaluates IF-THEN-ELSE logic per row to generate dynamic categorized columns.","descriptionAr":"يُنشئ أعمدة محسوبة ديناميكياً بناءً على شروط متعددة تشبه جمل IF-ELSE.","sampleSql":"SELECT item_name, price, CASE WHEN price >= 300 THEN 'Premium' ELSE 'Standard' END AS price_tag FROM items;"},{"titleEn":"Common Table Expressions (CTE WITH ... AS)","titleAr":"الجداول التعبيرية المشتركة (CTE - WITH ... AS)","levelEn":"Master","levelAr":"محترف","descriptionEn":"Defines reusable named temporary result sets for modular, readable complex queries.","descriptionAr":"تسمح بتعريف جدول مؤقت باستخدام WITH لتسهيل التحليلات وتقسيم الاستعلامات المعقدة.","sampleSql":"WITH rich_heroes AS (SELECT name, gold FROM heroes WHERE gold >= 400) SELECT * FROM rich_heroes ORDER BY gold DESC;"},{"titleEn":"Analytical Window Functions (OVER & RANK)","titleAr":"دوال النوافذ التحليلية (Window Functions - OVER)","levelEn":"Master","levelAr":"محترف","descriptionEn":"Calculates rankings and running metrics across rows without collapsing the underlying dataset.","descriptionAr":"تحسب الترتيب (RANK, ROW_NUMBER) أو الإحصائيات عبر نافذة من الصفوف دون تقليص عدد الصفوف الأصلية.","sampleSql":"SELECT name, role, power, RANK() OVER (PARTITION BY role ORDER BY power DESC) AS role_rank FROM heroes;"}],"projects":[{"id":1,"level":"beginner","free":true,"titleEn":"Neighborhood Bookshop","titleAr":"مكتبة الحي","storyEn":"You run a small bookshop in Cairo. Answer the owner's everyday questions about books, authors, customers and sales.","storyAr":"بتشتغل في مكتبة صغيرة في القاهرة. جاوب على أسئلة صاحب المكتبة اليومية عن الكتب والمؤلفين والعملاء والمبيعات.","schema":"CREATE TABLE authors(id INTEGER PRIMARY KEY, name TEXT, country TEXT);\nINSERT INTO authors VALUES (1,'Naguib Mahfouz','Egypt'),(2,'Ahdaf Soueif','Egypt'),(3,'Alaa Al Aswany','Egypt'),(4,'Taha Hussein','Egypt'),(5,'Gabriel Garcia Marquez','Colombia'),(6,'Paulo Coelho','Brazil'),(7,'Agatha Christie','UK'),(8,'George Orwell','UK'),(9,'Haruki Murakami','Japan'),(10,'Khaled Hosseini','Afghanistan'),(11,'Yuval Noah Harari','Israel'),(12,'Stephen Covey','USA');\nCREATE TABLE books(id INTEGER PRIMARY KEY, title TEXT, author_id INTEGER REFERENCES authors(id), category TEXT, price INTEGER, stock INTEGER, published_year INTEGER);\nINSERT INTO books VALUES (1,'Midaq Alley',1,'Fiction',180,54,2001),(2,'Palace Walk',1,'Fiction',175,59,2006),(3,'The Cairo Trilogy',1,'Fiction',160,3,2016),(4,'Map of Love',2,'Fiction',170,13,2014),(5,'The Yacoubian Building',3,'Fiction',125,58,2004),(6,'Chicago',3,'Fiction',165,44,2020),(7,'The Days',4,'History',195,21,2009),(8,'Hundred Years of Solitude',5,'Fiction',100,16,2001),(9,'Love in the Time of Cholera',5,'Fiction',115,5,2009), tal_stock FROM books","ordered":false,"empty":false},{"n":7,"en":"Show titles of Fiction books published in 2010 or later, or any Kids book.","ar":"اعرض عناوين كتب Fiction المنشورة سنة 2010 أو بعدها، أو أي كتاب في قسم Kids.","sql":"SELECT title FROM books WHERE (category = 'Fiction' AND published_year >= 2010) OR category = 'Kids'","ordered":false,"empty":false},{"n":8,"en":"Show categories whose average price is above 120 EGP, with the average rounded to 1 decimal.","ar":"اعرض الأقسام اللي متوسط سعرها أعلى من 120 جنيه مع المتوسط مقرّباً لرقم عشري واحد.","sql":"SELECT category, ROUND(AVG(price), 1) AS avg_price FROM books GROUP BY category HAVING AVG(price) > 120","ordered":false,"empty":false},{"n":9,"en":"Show each book title with its author name, for books priced under 100 EGP.","ar":"اعرض عنوان كل كتاب مع اسم مؤلفه للكتب اللي سعرها أقل من 100 جنيه.","sql":"SELECT b.title, a.name FROM books b JOIN authors a ON a.id = b.author_id WHERE b.price < 100","ordered":false,"empty":false},{"n":10,"en":"Which 5 books sold the most units in total? Show title and total units, highest first (ties by title).","ar":"أي 5 كتب بيعت منها أكبر كمية؟ اعرض العنوان وإجمالي الكمية من الأعلى للأقل (والتعادل بالعنوان).","sql":"SELECT b.title, SUM(s.qty) AS units FROM sales s JOIN books b ON b.id = s.book_id GROUP BY b.id ORDER BY units DESC, b.title LIMIT 5","ordered":true,"empty":false},{"n":11,"en":"Calculate the revenue (quantity x price) of each category, highest first.","ar":"احسب إيراد كل قسم (الكمية × السعر) من الأعلى للأقل.","sql":"SELECT b.category, SUM(s.qty * b.price) AS revenue FROM sales s JOIN books b ON b.id = s.book_id GROUP BY b.category ORDER BY revenue DESC","ordered":true,"empty":false},{"n":12,"en":"Which customers never bought anything? Show their names.","ar":"أي عملاء لم يشتروا أي شيء؟ اعرض أسماءهم.","sql":"SELECT c.name FROM customers c LEFT JOIN sales s ON s.customer_id = c.id WHERE s.id IS NULL","ordered":false,"empty":false}],"taskCount":12,"tables":["authors" الاسم.","sql":"SELECT name, birth_year FROM students WHERE birth_year >= 2010 ORDER BY name","ordered":true,"empty":false},{"n":3,"en":"How many students are in each class?","ar":"كم طالباً في كل فصل؟","sql":"SELECT class, COUNT(*) AS students FROM students GROUP BY class","ordered":false,"empty":false},{"n":4,"en":"What is the average score over all grades, rounded to 2 decimals?","ar":"ما متوسط كل الدرجات مقرّباً لرقمين عشريين؟","sql":"SELECT ROUND(AVG(score), 2) AS avg_score FROM grades","ordered":false,"empty":false},{"n":5,"en":"What is the highest score ever recorded in Math? Show the score.","ar":"ما أعلى درجة سُجلت في مادة Math؟","sql":"SELECT MAX(g.score) AS best FROM grades g JOIN subjects s ON s.id = g.subject_id WHERE s.name = 'Math'","ordered":false,"empty":false},{"n":6,"en":"Show the average score of each subject (subject name and average rounded to 1 decimal).","ar":"اعرض متوسط درجات كل مادة (اسم المادة والمتوسط بعشري واحد).","sql":"SELECT s.name, ROUND(AVG(g.score), 1) AS avg_score FROM grades g JOIN subjects s ON s.id = g.subject_id GROUP BY s.id","ordered":false,"empty":false},{"n":7,"en":"List the names of students who scored below 40 in any exam (each name once).","ar":"اعرض أسماء الطلاب اللي حصلوا على أقل من 40 في أي امتحان (كل اسم مرة).","sql":"SELECT DISTINCT st.name FROM students st JOIN grades g ON g.student_id = st.id WHERE g.score < 40","ordered":false,"empty":false},{"n":8,"en":"Find the top 5 students by average score. Show name and average (1 decimal), best first, ties by name.","ar":"اعرض أفضل 5 طلاب حسب متوسط الدرجات: الاسم والمتوسط (عشري واحد) من الأعلى للأقل، والتعادل بالاسم.","sql":"SELECT st.name, ROUND(AVG(g.score), 1) AS avg_score FROM students st JOIN grades g ON g.student_id = st.id GROUP BY st.id ORDER BY AVG(g.score) DESC, st.name LIMIT 5","ordered":true,"empty":false},{"n":9,"en":"Which subjects have an average score below 68? Show subject name and average (1 decimal).","ar":"أي مواد متوسطها أقل من 68؟ اعرض اسم المادة والمتوسط (عشري واحد).","sql":"SELECT s.name, ROUND(AVG(g.score), 1) AS avg_score FROM grades g JOIN subjects s ON s.id = g.subject_id GROUP BY s.id HAVING AVG(g.score) < 68","ordered":false,"empty":false},{"n":10,"en":"How many students have an overall average of 80 or more?","ar":"كم طالباً متوسطه العام 80 أو أكثر؟","sql":"SELECT COUNT(*) AS strong_students FROM (SELECT student_id FROM grades GROUP BY student_id HAVING AVG(score) >= 80)","ordered":false,"empty":false},{"n":11,"en":"Show the average score of each class (class and average rounded to 1 decimal), best class first.","ar":"اعرض متوسط درجات كل فصل (الفصل والمتوسط بعشري واحد) بدءاً بالأفضل.","sql":"SELECT st.class, ROUND(AVG(g.score), 1) AS avg_score FROM students st JOIN grades g ON g.student_id = st.id GROUP BY st.class ORDER BY AVG(g.score) DESC","ordered":true,"empty":false},{"n":12,"en":"Which students have no grades in term 2? Show their names.","ar":"أي طلاب ليس لهم أي درجات في الترم الثاني؟ اعرض أسماءهم.","sql":"SELECT name FROM students st WHERE NOT EXISTS (SELECT 1 FROM grades g WHERE g.student_id = st.id AND g.term = 2)","ordered":false,"empty":false}],"taskCount":12,"tables":["students","subjects","grades"]},{"id":3,"level":"beginner","free":true,"titleEn":"Corner Cafe","titleAr":"مقهى الناصية","storyEn":"A busy cafe tracks every order. Use the data to find best sellers, busy days and how customers pay.","storyAr":"مقهى مزدحم بيسجل كل طلب. استخدم البيانات عشان تعرف الأكثر مبيعاً والأيام المزدحمة وطريقة دفع العملاء.","schema":"CREATE TABLE menu_items(id INTEGER PRIMARY KEY, name TEXT, category TEXT, price INTEGER);\nINSERT INTO menu_items VALUES (1,'Espresso','Coffee',35),(2,'Americano','Coffee',40),(3,'Cappuccino','Coffee',55),(4,'Latte','Coffee',60),(5,'Turkish Coffee','Coffee',38),(6,'Mocha','Coffee',65),(7,'Green Tea','Tea',30),(8,'Karak Tea','Tea',35),(9,'Hibiscus','Tea',28),(10,'Mint Lemonade','Cold',45),(11,'Iced Latte','Cold',62),(12,'Mango Smoothie','Cold',70),(13,'Croissant','Bakery',42),( ,1,3),(442,180,3,1),(443,180,10,3);","tasks":[{"n":1,"en":"Show the whole menu ordered by price, cheapest first (ties by name).","ar":"اعرض المنيو كله مرتباً بالسعر من الأرخص (والتعادل بالاسم).","sql":"SELECT name, price FROM menu_items ORDER BY price, name","ordered":true,"empty":false},{"n":2,"en":"Show the names of all items in the 'Coffee' category.","ar":"اعرض أسماء كل أصناف قسم 'Coffee'.","sql":"SELECT name FROM menu_items WHERE category = 'Coffee'","ordered":false,"empty":false},{"n":3,"en":"How many orders were paid by 'Card'?","ar":"كم طلباً تم دفعه بـ 'Card'؟","sql":"SELECT COUNT(*) AS card_orders FROM orders WHERE payment = 'Card'","ordered":false,"empty":false},{"n":4,"en":"Show the 5 busiest days: the order date and the number of orders, most orders first (ties by date).","ar":"اعرض أكثر 5 أيام ازدحاماً: تاريخ الطلب وعدد الطلبات، الأكثر أولاً (والتعادل بالتاريخ).","sql":"SELECT order_date, COUNT(*) AS orders FROM orders GROUP BY order_date ORDER BY orders DESC, order_date LIMIT 5","ordered":true,"empty":false},{"n":5,"en":"Which item sold the most units in total? Show the name and total units.","ar":"أي صنف بيعت منه أكبر كمية؟ اعرض الاسم وإجمالي الكمية.","sql":"SELECT m.name, SUM(oi.qty) AS units FROM order_items oi JOIN menu_items m ON m.id = oi.item_id GROUP BY m.id ORDER BY units DESC, m.name LIMIT 1","ordered":true,"empty":false},{"n":6,"en":"Calculate the revenue of each category (quantity x price), highest first.","ar":"احسب إيراد كل قسم (الكمية × السعر) من الأعلى للأقل.","sql":"SELECT m.category, SUM(oi.qty * m.price) AS revenue FROM order_items oi JOIN menu_items m ON m.id = oi.item_id GROUP BY m.category ORDER BY revenue DESC","ordered":true,"empty":false},{"n":7,"en":"What is the average order value in EGP, rounded to 2 decimals? (An order total is the sum of qty x price of its items.)","ar":"ما متوسط قيمة الطلب بالجنيه مقرّباً لرقمين؟ (إجمالي الطلب = مجموع الكمية × السعر لأصنافه).","sql":"SELECT ROUND(AVG(total), 2) AS avg_order FROM (SELECT oi.order_id, SUM(oi.qty * m.price) AS total FROM order_items oi JOIN menu_items m ON m.id = oi.item_id GROUP BY oi.order_id)","ordered":false,"empty":false},{"n":8,"en":"Which orders contain more than 4 order lines? Show the order id and the number of lines.","ar":"أي طلبات فيها أكثر من 4 بنود؟ اعرض رقم الطلب وعدد البنود.","sql":"SELECT order_id, COUNT(*) AS lines FROM order_items GROUP BY order_id HAVING COUNT(*) > 4","ordered":false,"empty":false},{"n":9,"en":"Which menu items were never ordered? Show their names.","ar":"أي أصناف من المنيو لم تُطلب أبداً؟ اعرض أسماءها.","sql":"SELECT m.name FROM menu_items m LEFT JOIN order_items oi ON oi.item_id = m.id WHERE oi.id IS NULL","ordered":false,"empty":false},{"n":10,"en":"Show the number of orders and the revenue for each payment method.","ar":"اعرض عدد الطلبات والإيراد لكل طريقة دفع.","sql":"SELECT o.payment, COUNT(DISTINCT o.id) AS orders, SUM(oi.qty * m.price) AS revenue FROM orders o JOIN order_items oi ON oi.order_id = o.id JOIN menu_items m ON m.id = oi.item_id GROUP BY o.payment","ordered":false,"empty":false},{"n":11,"en":"Which weekday is the busiest? Show the weekday number (0 = Sunday ... 6 = Saturday, using strftime('%w')) and its number of orders, busiest first.","ar":"أي يوم في الأسبوع هو الأكثر ازدحاماً؟ اعرض رقم اليوم (0 = الأحد ... 6 = السبت باستخدام strftime('%w')) وعدد طلباته بدءاً بالأكثر.","sql":"SELECT strftime('%w', order_date) AS weekday, COUNT(*) AS orders FROM orders GROUP BY weekday ORDER BY orders DESC, weekday","ordered":true,"empty":false},{"n":12,"en":"Show the revenue of each month (format YYYY-MM), in month order.","ar":"اعرض إيراد كل شهر (بصيغة YYYY-MM) بترتيب الشهور.","sql":"SELECT strftime('%Y-%m', o.order_date) AS month, SUM(oi.qty * m.price) AS revenue FROM orders o JOIN order_items oi ON oi.order_id = o.id JOIN menu_items m ON m.id = oi.item_id GROUP BY month ORDER BY month","ordered":true,"empty":false}],"taskCount":12,"tables":["menu_items","orders","order_items"]},{"id":4,"level":"intermediate","free":false,"titleEn":"Online Store","titleAr":"متجر إلكتروني","storyEn":"An Egyptian online shop wants to understand its customers, products and order flow. Build the reports the sales manager asks for every week.","storyAr":"متجر إلكتروني مصري عايز يفهم عملاءه ومنتجاته وحركة الطلبات. اعمل التقارير اللي مدير المبيعات بيطلبها كل أسبوع.","taskCount":14,"locked":true,"tables":["customers","categories","products","orders","order_items"]},{"id":5,"level":"intermediate","free":false,"titleEn":"Family Clinic","titleAr":"عيادة الأسرة","storyEn":"A family clinic books appointments for several doctors. Help the manager measure attendance, revenue and patient behavior.","storyAr":"عيادة أسرة بتحجز مواعيد لعدة أطباء. ساعد المدير يقيس الحضور والإيراد وسلوك المرضى.","taskCount":13,"locked":true,"tables":["doctors","patients","appointments"]},{"id":6,"level":"intermediate","free":false,"titleEn":"Delivery Company","titleAr":"شركة توصيل","storyEn":"A courier company delivers parcels across Greater Cairo. Measure speed, lateness and courier performance.","storyAr":"شركة شحن بتوصّل طرود في القاهرة الكبرى. قِس السرعة والتأخير وأداء المناديب.","taskCount":14,"locked":true,"tables":["zones","couriers","deliveries"]},{"id":7,"level":"intermediate","free":false,"titleEn":"Nile Hotel","titleAr":"فندق النيل","storyEn":"A 4-star hotel on the Nile tracks rooms, guests, bookings and payments. Answer the revenue manager's questions about occupancy and income.","storyAr":"فندق 4 نجوم على النيل بيتابع الغرف والنزلاء والحجوزات والمدفوعات. جاوب أسئلة مدير الإيرادات عن الإشغال والدخل.","taskCount":14,"locked":true,"tables":["rooms","guests","bookings","payments"]},{"id":8,"level":"advanced","free":false,"titleEn":"Nile Bank","titleAr":"بنك النيل","storyEn":"A retail bank manages customers, accounts, transactions and loans. Build the analyst reports used by management and the risk team.","storyAr":"بنك تجزئة بيدير العملاء والحسابات والمعاملات والقروض. ابنِ تقارير المحللين وفريق المخاطر.","taskCount":14,"locked":true,"tables":["customers","accounts","transactions","loans","loan_payments"]},{"id":9,"level":"advanced","free":false,"titleEn":"HR & Payroll","titleAr":"الموارد البشرية والرواتب","storyEn":"A mid-size company keeps employees, departments, salaries, reviews and leave requests. Answer HR's analytical questions, including the org chart.","storyAr":"شركة متوسطة بتحفظ الموظفين والأقسام والرواتب والتقييمات والإجازات. جاوب أسئلة الموارد البشرية التحليلية بما فيها الهيكل التنظيمي.","taskCount":15,"locked":true,"tables":["departments","employees","reviews","leaves"]},{"id":10,"level":"advanced","free":false,"titleEn":"Airline","titleAr":"شركة طيران","storyEn":"A regional airline sells seats on flights between Egyptian and Gulf airports. Analyse load factors, revenue and passenger behaviour.","storyAr":"شركة طيران إقليمية بتبيع مقاعد على رحلات بين مطارات مصرية وخليجية. حلّل نسب الإشغال والإيراد وسلوك الركاب.","taskCount":13,"locked":true,"tables":["airports","flights","passengers","tickets"]},{"id":11,"level":"advanced","free":false,"titleEn":"Streaming Service","titleAr":"منصة بث","storyEn":"A streaming platform records subscribers, titles and watch events. Help the product team understand engagement, retention and content performance.","storyAr":"منصة بث بتسجّل المشتركين والمحتوى وأحداث المشاهدة. ساعد فريق المنتج يفهم التفاعل والاحتفاظ بالمشتركين وأداء المحتوى.","taskCount":13,"locked":true,"tables":["users","titles","watch_events"]},{"id":12,"level":"professional","free":false,"titleEn":"SaaS Subscriptions","titleAr":"اشتراكات SaaS","storyEn":"A software company sells monthly subscriptions. Finance wants MRR, churn, cohorts and upgrade paths from raw billing data.","storyAr":"شركة برمجيات بتبيع اشتراكات شهرية. المالية عايزة MRR ومعدل الإلغاء والدفعات (cohorts) ومسارات الترقية من بيانات الفوترة.","taskCount":14,"locked":true,"tables":["plans","companies","subscriptions","invoices"]},{"id":13,"level":"professional","free":false,"titleEn":"S
