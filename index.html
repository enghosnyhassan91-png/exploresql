<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2048%2048'%3E%3Crect%20width='48'%20height='48'%20rx='11'%20fill='%23141a2b'/%3E%3Cpath%20d='M42.41%2016.19A20%2020%200%201%201%2031.81%205.59'%20fill='none'%20stroke='%23eef2fb'%20stroke-width='3.6'%20stroke-linecap='round'/%3E%3Cg%20transform='rotate(45%2024%2024)'%3E%3Cpath%20d='M24%200%2030.5%2024h-13Z'%20fill='%23f2b230'/%3E%3Cpath%20d='M24%2044%2017.5%2024h13Z'%20fill='%23eef2fb'/%3E%3C/g%3E%3C/svg%3E" type="image/svg+xml">

<meta name="theme-color" content="#f6f7fb">
<meta name="description" content="تعلّم SQL من الصفر للاحتراف عبر 100 مرحلة تفاعلية بالعربي والإنجليزي. أول 25 مرحلة مجاناً.">
<title>ExploreSQL — تعلّم SQL بالتجربة، 100 مرحلة</title>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600&family=JetBrains+Mono:wght@400;600&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>/* ExploreSQL web — light "paper" identity: soft white ground, ink text, lagoon for free ground, gold for the premium gate. Code panels stay dark on purpose. */
:root{
  --ink:#f6f7fb; --ink2:#ffffff; --ink3:#eceff6; --line:#dbe0ec;
  --tx:#141a2b; --mut:#5a6480; --lagoon:#19b8a5; --lagoon-d:#0b6b61;
  --gold:#f2b230; --gold-d:#7a5410; --rose:#cf2f4d; --ok:#14803c;
  --r-s:8px; --r-m:14px; --r-l:24px;
  --f-head:"Inter","Noto Naskh Arabic",system-ui,serif;
  --f-body:"Inter","Noto Naskh Arabic",system-ui,serif;
  --f-code:"JetBrains Mono","Fira Code",ui-monospace,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--ink);color:var(--tx);font:400 17px/1.85 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-head);line-height:1.25;margin:0;font-weight:600;letter-spacing:-.01em}
p{margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button{font:inherit;color:inherit;cursor:pointer}
code,pre,.code{font-family:var(--f-code);direction:ltr;text-align:left}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:rgba(246,247,251,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;height:62px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--tx)}
.logo{width:36px;height:36px;flex:0 0 auto;color:var(--tx)}
.wm{font:600 23px/1 Sora,Inter,system-ui,sans-serif;letter-spacing:-.03em;display:inline-flex;align-items:center;gap:6px;direction:ltr}
.wm i{font:700 13px/1 'JetBrains Mono',ui-monospace,monospace;font-style:normal;background:var(--lagoon);color:#03211d;padding:4px 7px;border-radius:6px;letter-spacing:0}
.top nav{display:flex;gap:4px;margin-inline-start:12px;flex:1;overflow-x:auto}
.top nav a{padding:8px 12px;border-radius:var(--r-s);text-decoration:none;color:var(--mut);white-space:nowrap;font-size:15px}
.top nav a.on,.top nav a:hover{color:var(--tx);background:var(--ink3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--ink3);padding:10px 18px;border-radius:12px;font-weight:600;text-decoration:none;transition:transform .15s,background .15s}
.btn:hover{background:#e1e6f1}.btn:active{transform:translateY(1px)}
.btn.go{background:var(--lagoon);border-color:var(--lagoon);color:#03211d}.btn.go:hover{background:#2fcdbb}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#2a1d00}.btn.gold:hover{background:#ffc24d}
.btn.big{padding:14px 26px;font-size:17px;border-radius:14px}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent}

/* hero */
.hero{padding:72px 0 56px;background:radial-gradient(900px 420px at 80% -10%,rgba(52,214,195,.16),transparent 60%),radial-gradient(700px 380px at 5% 10%,rgba(246,189,59,.10),transparent 60%)}
.hero .wrap{display:grid;grid-template-columns:1.05fr 1fr;gap:44px;align-items:center}
.hero h1{font-size:clamp(34px,5.4vw,58px);font-weight:700}
.hero h1 em{font-style:normal;color:var(--lagoon)}
.hero .lead{color:var(--mut);font-size:19px;margin:18px 0 28px;max-width:34em}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap}
.hero .proof{display:flex;gap:22px;margin-top:26px;color:var(--mut);font-size:14px;flex-wrap:wrap}
.hero .proof b{color:var(--tx);font-family:var(--f-head)}
.term{background:#0a1020;border:1px solid var(--line);border-radius:var(--r-l);box-shadow:0 30px 70px rgba(20,30,60,.22);overflow:hidden;direction:ltr}
.term .bar{display:flex;gap:7px;padding:12px 16px;background:#131c33;border-bottom:1px solid #26324f;align-items:center}
.term .bar i{width:11px;height:11px;border-radius:50%;background:#33415f}
.term .bar span{margin-inline-start:auto;color:#9aa8c7;font:12px var(--f-code)}
.term pre{margin:0;padding:18px 20px;font:15px/1.7 var(--f-code);min-height:116px;color:#cfe0ff;white-space:pre-wrap}
.k{color:#34d6c3}.term .sq{color:#f6bd3b}.sq{color:var(--gold-d)}.term table{color:#d7e4ff}.term th{color:#8fa0c4}.term td,.term th{border-color:#26324f}.n{color:#ff9bb0}
.term table{width:100%;border-collapse:collapse;font:13px var(--f-code)}
.term th,.term td{padding:8px 16px;text-align:left;border-top:1px solid #26324f}
.term th{color:#8fa0c4;font-weight:500}
.term tr.in td{animation:rowin .5s both}
@keyframes rowin{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
.term .ok{padding:10px 16px;color:var(--ok);font:13px var(--f-code);border-top:1px solid var(--line)}

/* sections */
section.sec{padding:64px 0}
.sec-h{max-width:640px;margin-bottom:30px}
.sec-h h2{font-size:clamp(26px,3.4vw,38px)}
.sec-h p{color:var(--mut);margin-top:10px;font-size:17px}

/* the road: the memorable piece — 15 worlds, a gate at level 25 */
.road{position:relative;display:flex;gap:10px;overflow-x:auto;padding:26px 4px 30px;align-items:stretch;scroll-snap-type:x proximity}
.world{flex:0 0 168px;scroll-snap-align:start;background:var(--ink2);border:1px solid var(--line);border-radius:var(--r-m);padding:14px;position:relative}
.world .ic{font-size:26px}
.world h3{font-size:15px;margin:8px 0 4px}
.world p{font-size:12.5px;color:var(--mut);line-height:1.5;direction:ltr;text-align:left}
.world .lv{display:block;margin-top:10px;font:600 12px var(--f-code);color:var(--lagoon);direction:ltr;text-align:start}
.world.free{border-color:rgba(52,214,195,.45)}
.world.paid{border-color:rgba(246,189,59,.35);background:linear-gradient(180deg,#fffaf0,#fff3d9)}
.world.paid .lv{color:#a8700a}
.gate{flex:0 0 150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;border-radius:var(--r-m);background:linear-gradient(180deg,rgba(246,189,59,.22),rgba(246,189,59,.06));border:1.5px dashed var(--gold);padding:14px}
.gate b{font:700 38px var(--f-head);color:#c4890d;line-height:1}
.gate span{font-size:13px;color:var(--gold-d)}

/* free vs premium */
.plans{display:grid;grid-template-columns:1fr 1.15fr;gap:18px;align-items:stretch}
.plan{background:var(--ink2);border:1px solid var(--line);border-radius:var(--r-l);padding:26px;display:flex;flex-direction:column;gap:14px}
.plan.pro{border:1.5px solid var(--gold);background:linear-gradient(180deg,#fffaf0,#ffffff);position:relative}
.plan h3{font-size:22px}.plan .price{font:700 42px var(--f-head)}.plan .price small{font:500 15px var(--f-body);color:var(--mut)}
.plan ul{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.plan li{display:flex;gap:10px;align-items:flex-start}
.plan li::before{content:"✓";color:var(--lagoon);font-weight:700}
.plan.pro li::before{color:#a8700a}
.plan .tag{position:absolute;top:-13px;inset-inline-start:24px;background:var(--gold);color:#2a1d00;font-weight:700;font-size:13px;padding:3px 12px;border-radius:99px}
.plan .btn{margin-top:auto}

/* trust */
.trust{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.trust div{padding:18px;border-inline-start:2px solid var(--lagoon);background:var(--ink2);border-radius:0 var(--r-m) var(--r-m) 0}
[dir=rtl] .trust div{border-radius:var(--r-m) 0 0 var(--r-m)}
.trust b{display:block;font:600 16px var(--f-head);margin-bottom:4px}
.trust span{color:var(--mut);font-size:14px}

details{background:var(--ink2);border:1px solid var(--line);border-radius:var(--r-m);padding:16px 18px;margin-bottom:10px}
summary{cursor:pointer;font:600 16px var(--f-head)}
details p{color:var(--mut);margin-top:10px}

/* app shell */
.app{display:grid;grid-template-columns:270px 1fr;gap:20px;padding:22px 0 60px}
.rail{position:sticky;top:78px;align-self:start;max-height:calc(100vh - 96px);overflow:auto;background:var(--ink2);border:1px solid var(--line);border-radius:var(--r-m);padding:10px}
.rail h4{margin:8px 8px 6px;font:600 14px var(--f-head);color:var(--mut)}
.rw{display:flex;align-items:center;gap:10px;width:100%;text-align:start;background:none;border:0;padding:9px 10px;border-radius:10px;color:var(--tx)}
.rw:hover,.rw.on{background:var(--ink3)}
.rw small{margin-inline-start:auto;color:var(--mut);font-family:var(--f-code);direction:ltr}
.rw.paid small{color:var(--gold-d)}
.panel{background:var(--ink2);border:1px solid var(--line);border-radius:var(--r-m);padding:20px;margin-bottom:14px}
.lvbar{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:14px}
.lvb{flex:0 0 auto;min-width:46px;padding:7px 11px;border-radius:10px;border:1px solid var(--line);background:var(--ink2);font:600 13px var(--f-code);direction:ltr}
.lvb.on{background:var(--lagoon);color:#03211d;border-color:var(--lagoon)}
.lvb.done{border-color:var(--ok);color:var(--ok)}.lvb.off{opacity:.45}.lvb.paid{border-color:var(--gold);color:var(--gold-d);background:#fffaf0}
.lvb.on.paid{background:var(--gold);color:#2a1d00}
.meta{display:flex;gap:10px;flex-wrap:wrap;color:var(--mut);font-size:14px;margin:6px 0 14px}
.pill{background:var(--ink3);border-radius:99px;padding:2px 12px;font-size:13px}
.lesson{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.lesson>div{background:var(--ink3);border-radius:var(--r-m);padding:14px}
.lesson h4{margin:0 0 6px;font:600 14px var(--f-head);color:var(--lagoon)}
textarea.ed{width:100%;min-height:170px;resize:vertical;background:#0a1020;color:#d7e4ff;border:1px solid var(--line);border-radius:12px;padding:14px;font:15px/1.65 var(--f-code);direction:ltr;text-align:left;tab-size:2}
.ed-actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.res{overflow:auto;border:1px solid var(--line);border-radius:12px;margin-top:8px;max-height:340px}
.res table{width:100%;border-collapse:collapse;font:13px var(--f-code);direction:ltr}
.res th,.res td{padding:7px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.res th{background:var(--ink3);position:sticky;top:0}
.msg{padding:12px 14px;border-radius:12px;margin-top:10px;font-weight:600}
.msg.good{background:rgba(74,222,128,.12);color:var(--ok);border:1px solid rgba(74,222,128,.4)}
.msg.bad{background:rgba(255,107,134,.1);color:var(--rose);border:1px solid rgba(255,107,134,.35)}
.hint{background:var(--ink3);border-inline-start:3px solid var(--gold);padding:10px 14px;border-radius:8px;margin-top:8px;font-size:14px;direction:ltr;text-align:left}

/* paywall in-app */
.gatecard{border:1.5px solid var(--gold);border-radius:var(--r-l);padding:26px;background:linear-gradient(180deg,#fffaf0,#ffffff)}
.gatecard h2{font-size:26px;margin:6px 0 10px}
.prog{height:10px;background:var(--ink3);border-radius:99px;overflow:hidden;margin:12px 0 4px}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--lagoon),var(--gold))}
.teaser{background:var(--ink3);border-radius:var(--r-m);padding:14px;margin:14px 0;position:relative;overflow:hidden}
.teaser::after{content:"";position:absolute;inset:auto 0 0 0;height:46%;background:linear-gradient(transparent,var(--ink3))}
.gcols{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;margin:14px 0;font-size:14px;color:var(--mut)}

.auth{max-width:440px;margin:40px auto}.auth input{width:100%;margin:6px 0;padding:12px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--tx);font:inherit}
.quizopt{display:block;width:100%;text-align:start;margin:8px 0;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--ink3)}
.quizopt.right{border-color:var(--ok);background:rgba(74,222,128,.14)}.quizopt.wrong{border-color:var(--rose);background:rgba(255,107,134,.12)}
.toast{position:fixed;bottom:18px;inset-inline:0;margin:auto;width:fit-content;max-width:90vw;background:#141a2b;color:#fff;padding:10px 18px;border-radius:12px;font-weight:600;z-index:50;box-shadow:0 10px 40px rgba(20,30,60,.3)}
footer{border-top:1px solid var(--line);color:var(--mut);padding:30px 0;font-size:14px}

@media(max-width:860px){.hero .wrap,.plans,.app,.lesson{grid-template-columns:1fr}.trust{grid-template-columns:1fr 1fr}.rail{position:static;max-height:none}.hero{padding-top:40px}}
@media(max-width:520px){.trust{grid-template-columns:1fr}.gcols{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* every platform: touch targets, notches, small phones, large desktops, tablets */
.btn,.lvb,.rw,.quizopt,nav a{min-height:44px}
.top{padding-top:env(safe-area-inset-top)}footer{padding-bottom:calc(30px + env(safe-area-inset-bottom))}
textarea.ed{font-size:16px}
@media(max-width:860px){.top .wrap{height:auto;padding-top:8px;padding-bottom:8px;flex-wrap:wrap}.top nav{order:3;flex-basis:100%;margin:0}.rail{display:flex;gap:6px;overflow-x:auto;padding:8px}.rail .rw{flex:0 0 auto;width:auto;white-space:nowrap}.hero h1{font-size:32px}.term pre{font-size:13px}.world{flex-basis:150px}}
@media(min-width:1500px){.wrap{max-width:1240px}}

/* settings + header user button */
.ubtn{gap:6px;padding:8px 14px;white-space:nowrap}.ubtn.on{background:var(--ink3)}.uav{font-size:18px;line-height:1}
.uname{max-width:130px;overflow:hidden;text-overflow:ellipsis}
@media (max-width:560px){.uname{display:none}}
.settings{max-width:760px;padding-top:26px;padding-bottom:70px}.settings .sh{font-size:clamp(26px,5vw,34px);margin-bottom:18px}
.settings .panel{margin-bottom:16px}.settings .panel h2{font-size:20px;margin-bottom:14px}
.settings .panel.pro{border-color:var(--gold);background:linear-gradient(180deg,#fffaf0,#fff)}
.settings label{display:block;font-size:14px;color:var(--mut);margin:14px 0 6px}
.settings input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--tx);font:inherit;min-width:0}
.settings .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.settings .row input{flex:1 1 180px}
.prof{display:flex;gap:16px;align-items:flex-start}.pf{flex:1;min-width:0}.pf label{margin-top:0}.pf small{display:block;margin-top:8px;overflow-wrap:anywhere}
.bigav{flex:0 0 auto;width:72px;height:72px;border-radius:20px;display:grid;place-items:center;font-size:40px;background:var(--ink3);border:1px solid var(--line)}
.avs{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px}
.av{height:50px;border-radius:12px;border:1.5px solid var(--line);background:var(--ink2);font-size:26px;line-height:1}.av.on{border-color:var(--lagoon);background:var(--ink3);box-shadow:0 0 0 3px rgba(25,184,165,.2)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-top:18px}
.stats div{background:var(--ink3);border-radius:12px;padding:12px;display:grid;gap:2px}.stats b{font:700 22px var(--f-head);font-variant-numeric:tabular-nums}.stats span{font-size:13px;color:var(--mut);line-height:1.5}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line);flex-wrap:wrap}.setrow:first-of-type{border-top:0;padding-top:0}
.setrow>div:first-child{min-width:0;flex:1 1 200px}.setrow b{display:block}.setrow small{display:block;color:var(--mut);font-size:14px;line-height:1.6}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}.seg button{border:0;background:var(--ink2);padding:9px 16px;font-weight:600}.seg button.on{background:var(--lagoon);color:#03211d}
.sw{width:52px;height:30px;border-radius:99px;border:0;background:#c5ccdc;position:relative;padding:0;transition:background .15s}.sw i{position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:inset-inline-start .15s}.sw.on{background:var(--lagoon)}.sw.on i{inset-inline-start:25px}
.chip{display:inline-block;padding:4px 14px;border-radius:99px;background:var(--ink3);font-weight:600;font-size:14px}.chip.gold{background:var(--gold);color:#2a1d00}
.plan-state{margin:0 0 8px}.stack{display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.btn.danger{background:var(--rose);border-color:var(--rose);color:#fff}.btn.danger-o{border-color:var(--rose);color:var(--rose);background:transparent}
.warnbox{border:1px solid var(--rose);background:rgba(207,47,77,.06);border-radius:14px;padding:14px;display:grid;gap:12px;max-width:100%}.warnbox p{margin:0;line-height:1.7}

.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
.confetti span{position:absolute;top:-30px;left:var(--x);font-size:26px;animation:cfall var(--d) ease-in forwards}
@keyframes cfall{to{transform:translateY(108vh) rotate(var(--r))}}
@media (prefers-reduced-motion:reduce){.confetti{display:none}}

/* speed quiz */
.quiz{max-width:760px;padding-top:22px;padding-bottom:70px}.quiz .panel{margin-bottom:14px}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.dot{width:34px;height:34px;border-radius:10px;border:1.5px solid var(--line);background:var(--ink2);font:600 13px var(--f-code);direction:ltr}.dot.done{background:var(--ink3);border-color:var(--lagoon);color:var(--lagoon-d)}.dot.cur{background:var(--lagoon);border-color:var(--lagoon);color:#03211d}
.qq{margin:8px 0 16px;font-size:clamp(20px,4.2vw,26px);line-height:1.6}
.quizopt.sel{border-color:var(--lagoon);background:rgba(25,184,165,.12);box-shadow:0 0 0 3px rgba(25,184,165,.18)}
.qnav{display:flex;gap:10px;justify-content:space-between;margin-top:18px}.qhint{margin:12px 0 0;font-size:14px;min-height:1.2em}
.qres{text-align:center;padding:30px 20px}.qres .score{font:700 64px/1.1 var(--f-head);font-variant-numeric:tabular-nums;margin:6px 0 14px}.qres .score small{font-size:28px;color:var(--mut)}
.qres .prog{max-width:360px;margin:0 auto 14px}.qmsg{font-size:19px;font-weight:600;margin:4px 0 8px}.qres.win{border-color:var(--gold);background:linear-gradient(180deg,#fffaf0,#fff)}.qres .btn{margin-top:14px}
.rvh{font-size:22px;margin:26px 0 12px}
.rv.ok{border-inline-start:4px solid var(--ok)}.rv.no{border-inline-start:4px solid var(--rose)}
.rvt{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}.rvt h3{flex:1 1 220px;min-width:0;font-size:17px;line-height:1.6}.rvn{width:30px;height:30px;border-radius:9px;background:var(--ink3);display:grid;place-items:center;font:700 14px var(--f-code)}
.rvl{display:grid;gap:8px;margin:14px 0 10px}.rvo{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--ink2)}.rvo code{flex:1 1 auto;min-width:0;overflow-wrap:anywhere}
.rvo em{font-style:normal;font-size:13px;font-weight:600;padding:2px 10px;border-radius:99px;background:var(--ink3)}
.rvo.right{border-color:var(--ok);background:rgba(20,128,60,.08)}.rvo.right em{background:var(--ok);color:#fff}.rvo.wrong{border-color:var(--rose);background:rgba(207,47,77,.07)}.rvo.wrong em{background:var(--rose);color:#fff}
.expl{margin:0;color:var(--mut);line-height:1.8;font-size:15px}

/* header dropdown */
.menuwrap{position:relative;display:flex;align-items:center;gap:8px}
.dd{position:absolute;top:calc(100% + 10px);inset-inline-end:0;width:min(330px,calc(100vw - 32px));background:var(--ink2);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 50px rgba(20,30,60,.22);padding:8px;display:grid;gap:2px;z-index:40;animation:ddin .14s ease-out}
@keyframes ddin{from{opacity:0;transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){.dd{animation:none}}
.mhead{display:flex;gap:12px;align-items:center;padding:10px 10px 12px;border-bottom:1px solid var(--line);margin-bottom:4px}.mhead div{min-width:0}.mhead b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mhead small{display:block;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mav{width:44px;height:44px;border-radius:13px;background:var(--ink3);display:grid;place-items:center;font-size:25px;flex:0 0 auto}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px;border-radius:10px;flex-wrap:wrap}
.mitem{display:block;width:100%;text-align:start;padding:11px 10px;border:0;border-radius:10px;background:transparent;font:inherit;font-weight:600;text-decoration:none;color:var(--tx)}.mitem:hover{background:var(--ink3)}
.btn.sm{padding:7px 14px;font-size:14px;border-radius:10px}
.dd .warnbox{margin:4px}

.auth label{display:block;font-size:14px;color:var(--mut);margin:12px 0 4px}.auth label.chk{display:flex;gap:8px;align-items:center;margin:12px 0}.auth label.chk input{width:auto;margin:0}
.auth .msg{margin:12px 0}.auth h2{margin-bottom:6px}

.pay{max-width:640px;padding-top:22px;padding-bottom:70px}.pay h2{font-size:24px;margin:0 0 6px}
.steps{padding-inline-start:22px;margin:16px 0;display:grid;gap:12px;line-height:1.8}
.wal{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0}.wal b{font-size:22px;letter-spacing:1px;background:var(--ink3);border:1px solid var(--line);border-radius:10px;padding:6px 12px;user-select:all}
.pay input[type=file]{width:100%;padding:10px 0}.rcpt{display:block;max-width:100%;max-height:260px;border:1px solid var(--line);border-radius:10px;margin:8px 0}
.rcpt.big{max-height:200px;cursor:zoom-in}.rcpt.zoom{max-height:none;cursor:zoom-out}
.pend .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.adnote{width:100%;margin-top:8px}
.pay .qtop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.adnote{padding:11px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--tx);font:inherit;font-size:15px}
</style>

<script>window.__CUR={"freeLimit":25,"levels":[{"id":1,"worldId":1,"xpReward":100,"conceptBadge":"SELECT * FROM","starterCode":"SELECT * FROM ","solutionSql":"SELECT * FROM heroes;","titleEn":"1. Awakening the Records: Select All Heroes","titleAr":"1. صحوة السجلات: استعراض جميع الأبطال","difficultyEn":"Beginner","difficultyAr":"مبتدئ","storyEn":"Welcome to ExploreSQL! The Royal Registry has been sealed for ages. Your first quest is to unlock the heroes table and display all heroes.","storyAr":"أهلاً بك في ExploreSQL! السجل الملكي مغلق منذ زمن، ومهمتك الأولى هي فتح جدول الأبطال (heroes) وعرض جميع السجلات الموجودة فيه.","lessonEn":"The SELECT statement retrieves data from a database table. Using * selects all columns, followed by FROM and the table name.","lessonAr":"أمر SELECT هو حجر الأساس في SQL ويُستخدم لاسترجاع البيانات من الجداول. الرمز * يعني جميع الأعمدة، متبوعاً بـ FROM ثم اسم الجدول.","syntax":"SELECT * FROM table_name;","missionEn":"Write a SQL query to retrieve all columns and all rows from the heroes table.","missionAr":"اكتب استعلاماً يعرض جميع الأعمدة وجميع الصفوف من جدول الأبطال heroes.","hintsEn":["Use * after SELECT to pick every column, followed by FROM and heroes.","Full solution: SELECT * FROM heroes;"],"hintsAr":["استخدم الرمز * بعد SELECT لاختيار كل الأعمدة، ثم اكتب FROM heroes.","الحل الكامل: SELECT * FROM heroes;"],"explanationEn":"1. SELECT * tells the SQLite engine to fetch all columns available.\n2. FROM heroes specifies that data should be read from the heroes table.","explanationAr":"1. SELECT * يخبر محرك قاعدة البيانات باسترجاع كافة الأعمدة.\n2. FROM heroes يحدد قراءة السجلات من جدول الأبطال heroes.","guardianNameEn":"Wooden Gate Keeper","guardianNameAr":"حارس البوابة الخشبية","guardianColorHex":4278556265,"tier":"FREE"},{"id":2,"worldId":1,"xpReward":120,"conceptBadge":"WHERE & AND","starterCode":"SELECT name, power\nFROM heroes\nWHERE ","solutionSql":"SELECT name, power FROM heroes WHERE role = 'Mage' AND power > 80;","titleEn":"2. Smart Filtering: Powerful Mages","titleAr":"2. التصفية الذكية: السحرة الأقوياء","difficultyEn":"Beginner","difficultyAr":"مبتدئ","storyEn":"The Royal Council needs a roster of names and combat power for all heroes whose role is Mage and whose power is strictly greater than 80.","storyAr":"يحتاج مجلس المملكة إلى قائمة بأسماء وقوة الأبطال السحرة (Mage) الذين تزيد قوتهم عن 80.","lessonEn":"Use the WHERE clause to filter rows. Wrap text literals in single quotes like 'Mage', and combine conditions with AND.","lessonAr":"نستخدم جملة WHERE لتصفية الصفوف. نضع النصوص بين علامات تنصيص مفردة مثل 'Mage'، ونربط بين الشروط بـ AND.","syntax":"SELECT col1, col2 FROM table WHERE col1 = 'Val' AND col2 > 80;","missionEn":"Select only name and power from heroes where role = 'Mage' AND power > 80.","missionAr":"اعرض عمودي name و power فقط من جدول heroes للأبطال الذين دورهم role = 'Mage' وقوتهم power > 80.","hintsEn":["Filter after WHERE using: role = 'Mage' AND power > 80","Full solution: SELECT name, power FROM heroes WHERE role = 'Mage' AND power > 80;"],"hintsAr":["بعد WHERE اكتب الشرطين: role = 'Mage' AND power > 80","الحل: SELECT name, power FROM heroes WHERE role = 'Mage' AND power > 80;"],"explanationEn":"1. SELECT name, power selects only the requested columns.\n2. WHERE role = 'Mage' filters for Mages.\n3. AND power > 80 ensures both conditions are met simultaneously.","explanationAr":"1. SELECT name, power يحدد عرض عمودي الاسم والقوة فقط.\n2. WHERE role = 'Mage' يختار السحرة فقط.\n3. AND power > 80 يشترط أن تكون القوة أكبر من 80 في نفس الوقت.","guardianNameEn":"Meadow Guardian","guardianNameAr":"حارس المروج","guardianColorHex":4279080072,"tier":"FREE"},{"id":3,"worldId":1,"xpReward":140,"conceptBadge":"ORDER BY ... DESC LIMIT","starterCode":"SELECT name, role, power\nFROM heroes\nORDER BY ","solutionSql":"SELECT name, role, power FROM heroes ORDER BY power DESC LIMIT 3;","titleEn":"3. Kingdom Elite: Top 3 Strongest","titleAr":"3. نخبة المملكة: أقوى 3 أبطال","difficultyEn":"Beginner+","difficultyAr":"مبتدئ متقدم","storyEn":"The Grand Tournament is starting! The King wants to see the top 3 strongest heroes ordered from highest power to lowest.","storyAr":"تستعد المملكة للبطولة الكبرى، ويريد الملك معرفة أقوى 3 أبطال في المملكة مرتبين من الأعلى قوة إلى الأقل.","lessonEn":"Use ORDER BY to sort rows. Add DESC for descending order. Add LIMIT 3 to cap the number of returned rows.","lessonAr":"لترتيب النتائج نستخدم ORDER BY، وللترتيب التنازلي نضيف DESC، ولتحديد عدد الصفوف نستخدم LIMIT.","syntax":"SELECT name, role, power FROM heroes ORDER BY power DESC LIMIT 3;","missionEn":"Select name, role, and power from heroes, sorted descending by power, limited to the top 3 rows.","missionAr":"اعرض name, role, power من جدول heroes مرتبة تنازلياً حسب power ومحددة بأول 3 صفوف فقط.","hintsEn":["Use ORDER BY power DESC then append LIMIT 3 at the end.","Full solution: SELECT name, role, power FROM heroes ORDER BY power DESC LIMIT 3;"],"hintsAr":["استخدم ORDER BY power DESC ثم أضف LIMIT 3 في النهاية.","الحل: SELECT name, role, power FROM heroes ORDER BY power DESC LIMIT 3;"],"explanationEn":"1. ORDER BY power DESC sorts from strongest to weakest.\n2. LIMIT 3 takes only the first 3 rows of that sorted list.","explanationAr":"1. ORDER BY power DESC يرتب السجلات تنازلياً من الأعلى قوة للأقل.\n2. LIMIT 3 يقتطع أول 3 صفوف فقط لعرض الأقوى.","guardianNameEn":"Stone Golem","guardianNameAr":"عملاق الصخور","guardianColorHex":4278355143,"tier":"FREE"},{"id":4,"worldId":1,"xpReward":150,"conceptBadge":"DISTINCT & ALIAS (AS)","starterCode":"SELECT DISTINCT role AS hero_class\nFROM ","solutionSql":"SELECT DISTINCT role AS hero_class FROM heroes;","titleEn":"4. Class Roster: Unique Roles & Aliasing","titleAr":"4. فئات الفرسان: القيم الفريدة وتسمية الأعمدة","difficultyEn":"Beginner+","difficultyAr":"مبتدئ متقدم","storyEn":"How many distinct hero classes exist in our realm? Eliminate duplicate roles and label the column hero_class.","storyAr":"كم عدد التخصصات الفريدة الموجودة في مملكتنا؟ احذف التكرار وسمّ العمود hero_class.","lessonEn":"DISTINCT eliminates duplicate rows from results. Use AS to give a column a custom friendly alias.","lessonAr":"تُستخدم DISTINCT لحذف القيم المكررة من النتيجة، وتُستخدم AS لإعطاء العمود اسماً مستعاراً مخصصاً.","syntax":"SELECT DISTINCT column_name AS alias_name FROM table_name;","missionEn":"Select distinct roles from heroes and alias the column as hero_class.","missionAr":"اعرض التخصصات الفريدة DISTINCT role من جدول heroes وسمّ العمود hero_class.","hintsEn":["Complete the query by adding FROM heroes; at the end.","Full solution: SELECT DISTINCT role AS hero_class FROM heroes;"],"hintsAr":["أكمل الاستعلام بإضافة FROM heroes; في النهاية.","الحل: SELECT DISTINCT role AS hero_class FROM heroes;"],"explanationEn":"1. DISTINCT role collapses duplicates so each role appears once.\n2. AS hero_class renames the output header in the result set.","explanationAr":"1. DISTINCT role يدمج المتشابهات فيظهر كل تخصص مرة واحدة.\n2. AS hero_class يعيد تسمية رأس العمود في النتيجة.","guardianNameEn":"Emerald Sentry","guardianNameAr":"حارس الزمرد","guardianColorHex":4279286145,"tier":"FREE"},{"id":5,"worldId":2,"xpReward":160,"conceptBadge":"COUNT, SUM, MAX","starterCode":"SELECT COUNT(*) AS total_heroes,\n       SUM(gold) AS total_gold,\n       ","solutionSql":"SELECT COUNT(*) AS total_heroes, SUM(gold) AS total_gold, MAX(power) AS max_power FROM heroes;","titleEn":"5. Royal Treasury: Aggregate Functions","titleAr":"5. خزينة المملكة: دوال التجميع والإحصاء","difficultyEn":"Intermediate","difficultyAr":"متوسط","storyEn":"The Treasurer requests a summary report: total number of heroes, total gold in kingdom, and maximum combat power.","storyAr":"يطلب وزير الخزينة تقريراً إحصائياً: إجمالي عدد الأبطال ومجموع الذهب وأعلى قوة قتالية.","lessonEn":"Aggregate functions compute a single metric across rows: COUNT(*) counts rows, SUM(col) totals numbers, and MAX(col) finds the highest value.","lessonAr":"تُستخدم دوال التجميع لحساب قيمة إجمالية: COUNT(*) لعد الصفوف، SUM(col) لجمع الأرقام، و MAX(col) لأعلى قيمة.","syntax":"SELECT COUNT(*), SUM(col), MAX(col) FROM table;","missionEn":"Calculate COUNT(*) AS total_heroes, SUM(gold) AS total_gold, and MAX(power) AS max_power from heroes.","missionAr":"احسب COUNT(*) AS total_heroes و SUM(gold) AS total_gold و MAX(power) AS max_power من جدول heroes.","hintsEn":["Add MAX(power) AS max_power and finish with FROM heroes;","Full solution: SELECT COUNT(*) AS total_heroes, SUM(gold) AS total_gold, MAX(power) AS max_power FROM heroes;"],"hintsAr":["أضف MAX(power) AS max_power ثم أكمل بـ FROM heroes;","الحل: SELECT COUNT(*) AS total_heroes, SUM(gold) AS total_gold, MAX(power) AS max_power FROM heroes;"],"explanationEn":"1. COUNT(*) counts all rows.\n2. SUM(gold) adds the gold of all heroes.\n3. MAX(power) retrieves the highest power rating.","explanationAr":"1. COUNT(*) يعد جميع السجلات في الجدول.\n2. SUM(gold) يجمع كل الذهب.\n3. MAX(power) يستخرج أعلى قيمة قوة قتالية.","guardianNameEn":"Golden Vault Warden","guardianNameAr":"حارس الخزينة الذهبية","guardianColorHex":4280640491,"tier":"FREE"},{"id":6,"worldId":2,"xpReward":180,"conceptBadge":"GROUP BY","starterCode":"SELECT role, COUNT(*) AS hero_count, AVG(power) AS avg_power\nFROM heroes\nGROUP BY ","solutionSql":"SELECT role, COUNT(*) AS hero_count, AVG(power) AS avg_power FROM heroes GROUP BY role;","titleEn":"6. Regiment Breakdown: Grouping by Role","titleAr":"6. تقسيم الكتائب: التجميع حسب التخصص","difficultyEn":"Intermediate","difficultyAr":"متوسط","storyEn":"The Commander wants to know how many heroes belong to each role along with the average power per role.","storyAr":"يريد قائد الجيش معرفة عدد الأبطال في كل تخصص ومتوسط القوة لكل تخصص.","lessonEn":"GROUP BY groups rows sharing the same value in a column (like role) and computes aggregates for each group independently.","lessonAr":"تُستخدم GROUP BY لتجميع الصفوف التي تتشابه في قيمة عمود معين، وتطبيق دوال التجميع على كل مجموعة على حدة.","syntax":"SELECT role, COUNT(*), AVG(power) FROM heroes GROUP BY role;","missionEn":"Select role, COUNT(*) AS hero_count, and AVG(power) AS avg_power from heroes grouped by role.","missionAr":"اعرض role و COUNT(*) AS hero_count و AVG(power) AS avg_power مجمعة بـ GROUP BY role.","hintsEn":["Add GROUP BY role at the end of the query.","Full solution: SELECT role, COUNT(*) AS hero_count, AVG(power) AS avg_power FROM heroes GROUP BY role;"],"hintsAr":["أضف GROUP BY role في نهاية الاستعلام.","الحل: SELECT role, COUNT(*) AS hero_count, AVG(power) AS avg_power FROM heroes GROUP BY role;"],"explanationEn":"1. GROUP BY role partitions rows into distinct role buckets.\n2. COUNT(*) and AVG(power) are evaluated per bucket.","explanationAr":"1. GROUP BY role يقسم السجلات لمجموعات حسب التخصص.\n2. تُحسب الدوال COUNT و AVG لكل تخصص مستقلاً.","guardianNameEn":"Armored Battalion Captain","guardianNameAr":"قائد الكتائب المدرعة","guardianColorHex":4283385573,"tier":"FREE"},{"id":7,"worldId":2,"xpReward":200,"conceptBadge":"GROUP BY ... HAVING","starterCode":"SELECT role, SUM(gold) AS total_gold\nFROM heroes\nGROUP BY role\nHAVING ","solutionSql":"SELECT role, SUM(gold) AS total_gold FROM heroes GROUP BY role HAVING SUM(gold) > 800;","titleEn":"7. Wealthy Regiments: The HAVING Clause","titleAr":"7. الكتائب الثرية: شرط المجموعات HAVING","difficultyEn":"Intermediate+","difficultyAr":"متوسط متقدم","storyEn":"Only roles whose heroes hold more than 800 total gold qualify for the Royal Honor Crest!","storyAr":"تُمنح شارة الشرف فقط للتخصصات التي يمتلك أبطالها أكثر من 800 قطعة ذهب في المجموع!","lessonEn":"WHERE filters individual rows before grouping, whereas HAVING filters aggregated groups after GROUP BY.","lessonAr":"تُفلتر WHERE الصفوف الفردية قبل التجميع، بينما تُفلتر HAVING المجموعات الناتجة بعد GROUP BY بناءً على دوال التجميع.","syntax":"SELECT col, SUM(val) FROM table GROUP BY col HAVING SUM(val) > 800;","missionEn":"Select role and SUM(gold) AS total_gold grouped by role, filtered with HAVING SUM(gold) > 800.","missionAr":"اعرض role و SUM(gold) AS total_gold مجمعة بـ GROUP BY role ومشروطة بـ HAVING SUM(gold) > 800.","hintsEn":["After GROUP BY role write: HAVING SUM(gold) > 800","Full solution: SELECT role, SUM(gold) AS total_gold FROM heroes GROUP BY role HAVING SUM(gold) > 800;"],"hintsAr":["بعد GROUP BY role اكتب: HAVING SUM(gold) > 800","الحل: SELECT role, SUM(gold) AS total_gold FROM heroes GROUP BY role HAVING SUM(gold) > 800;"],"explanationEn":"1. GROUP BY role sums gold for each role.\n2. HAVING SUM(gold) > 800 filters out groups that do not meet the gold threshold.","explanationAr":"1. GROUP BY role يجمع الذهب لكل تخصص.\n2. HAVING SUM(gold) > 800 يستبعد التخصصات التي يقل مجموع ذهبها عن 800.","guardianNameEn":"Azure Crystal Mage","guardianNameAr":"ساحر البلور الأزرق","guardianColorHex":4284704497,"tier":"FREE"},{"id":8,"worldId":2,"xpReward":210,"conceptBadge":"BETWEEN & IN Filters","starterCode":"SELECT name, role, power, gold\nFROM heroes\nWHERE ","solutionSql":"SELECT name, role, power, gold FROM heroes WHERE level BETWEEN 5 AND 9 AND role IN ('Warrior', 'Mage');","titleEn":"8. Range & Set Matching: BETWEEN and IN","titleAr":"8. نطاقات وقوائم المطابقة: BETWEEN و IN","difficultyEn":"Intermediate+","difficultyAr":"متوسط متقدم","storyEn":"Pick heroes of moderate veteran rank (level 5 to 9 inclusive) who are either Warriors or Mages.","storyAr":"اختر الأبطال ذوي المستوى المتوسط (من المستوى 5 إلى 9) وتخصصهم إما Warrior أو Mage.","lessonEn":"BETWEEN x AND y tests inclusive ranges. IN ('a', 'b') checks if a column matches any element in a list.","lessonAr":"تختبر BETWEEN x AND y نطاقاً شاملاً للطرفين، وتختبر IN ما إذا كانت القيمة تطابق أي عنصر في القائمة.","syntax":"SELECT * FROM table WHERE col BETWEEN 5 AND 9 AND cat IN ('A', 'B');","missionEn":"Select name, role, power, gold from heroes where level BETWEEN 5 AND 9 AND role IN ('Warrior', 'Mage').","missionAr":"اعرض name, role, power, gold من heroes بشرط level BETWEEN 5 AND 9 AND role IN ('Warrior', 'Mage').","hintsEn":["Write: WHERE level BETWEEN 5 AND 9 AND role IN ('Warrior', 'Mage');","Full solution: SELECT name, role, power, gold FROM heroes WHERE level BETWEEN 5 AND 9 AND role IN ('Warrior', 'Mage');"],"hintsAr":["اكتب شرط WHERE: level BETWEEN 5 AND 9 AND role IN ('Warrior', 'Mage');","الحل: SELECT name, role, power, gold FROM heroes WHERE level BETWEEN 5 AND 9 AND role IN ('Warrior', 'Mage');"],"explanationEn":"1. level BETWEEN 5 AND 9 selects levels 5, 6, 7, 8, 9.\n2. role IN ('Warrior', 'Mage') selects either Warriors or Mages.","explanationAr":"1. level BETWEEN 5 AND 9 يختار المستويات من 5 إلى 9.\n2. role IN ('Warrior', 'Mage') يطابق تخصص المحاربين والسحرة.","guardianNameEn":"Storm Archer","guardianNameAr":"رامي العواصف","guardianColorHex":4286331629,"tier":"FREE"},{"id":9,"worldId":3,"xpReward":220,"conceptBadge":"INNER JOIN ... ON","starterCode":"SELECT h.name, h.role, g.guild_name, g.city\nFROM heroes h\nINNER JOIN guilds g ON ","solutionSql":"SELECT h.name, h.role, g.guild_name, g.city FROM heroes h INNER JOIN guilds g ON h.guild_id = g.id;","titleEn":"9. Guild Alliances: INNER JOIN","titleAr":"9. تحالف النقابات: الربط الداخلي INNER JOIN","difficultyEn":"Advanced","difficultyAr":"متقدم","storyEn":"Guild details are stored in guilds table. Link each hero to their guild name and city using the shared foreign key!","storyAr":"بيانات النقابات محفوظة في جدول guilds. اربط كل بطل باسم نقابته ومدينتها عبر المفتاح الأجنبي المشترك!","lessonEn":"INNER JOIN combines rows from two tables where the join condition (h.guild_id = g.id) matches. Unmatched rows are excluded.","lessonAr":"يربط INNER JOIN بين جدولين عندما يتطابق شرط الربط (h.guild_id = g.id). يُستبعد أي صف غير متطابق.","syntax":"SELECT h.name, g.guild_name FROM heroes h INNER JOIN guilds g ON h.guild_id = g.id;","missionEn":"Join heroes h with guilds g using INNER JOIN on h.guild_id = g.id and select h.name, h.role, g.guild_name, g.city.","missionAr":"اربط heroes h مع guilds g بـ INNER JOIN على h.guild_id = g.id واعرض le, guild_name.","hintsEn":["Write: LEFT JOIN guilds g ON h.guild_id = g.id","Full solution: SELECT h.name, h.role, g.guild_name FROM heroes h LEFT JOIN guilds g ON h.guild_id = g.id;"],"hintsAr":["اكتب: LEFT JOIN guilds g ON h.guild_id = g.id","الحل: SELECT h.name, h.role, g.guild_name FROM heroes h LEFT JOIN guilds g ON h.guild_id = g.id;"],"explanationEn":"1. LEFT JOIN preserves all heroes.\n2. Heroes without guilds appear with NULL in guild_name without getting dropped.","explanationAr":"1. LEFT JOIN يحافظ على كل الأبطال دون استبعاد.\n2. الأبطال المستقلون يظهرون مع NULL في اسم النقابة.","guardianNameEn":"Violet Mist Knight","guardianNameAr":"فارس الضباب البنفسجي","guardianColorHex":4287323382,"tier":"FREE"},{"id":11,"worldId":3,"xpReward":260,"conceptBadge":"JOIN + GROUP BY + ORDER BY","starterCode":"SELECT h.name, COUNT(*) AS quests_count, SUM(q.reward) AS total_reward\nFROM heroes h\nINNER JOIN quests q ON h.id = q.hero_id\nGROUP BY h.name\nORDER BY ","solutionSql":"SELECT h.name, COUNT(*) AS quests_count, SUM(q.reward) AS total_reward FROM heroes h INNER JOIN quests q ON h.id = q.hero_id GROUP BY h.name ORDER BY total_reward DESC;","titleEn":"11. Quest Rewards: Combining JOIN & Aggregates","titleAr":"11. حصاد المهام: دمج الربط مع التجميع","difficultyEn":"Advanced+","difficultyAr":"متقدم جداً","storyEn":"Calculate total quest rewards earned by each hero by joining heroes with quests, grouping by hero name, and sorting by reward!","storyAr":"احسب إجمالي مكافآت المهام لكل بطل بربط الأبطال مع جدول المهام وتجميع النتائج بالاسم وترتيبها بالمكافأة!","lessonEn":"You can combine INNER JOIN with GROUP BY and ORDER BY to create comprehensive analytical reports across relational tables.","lessonAr":"يمكن دمج INNER JOIN مع GROUP BY و ORDER BY لإنشاء تقارير تحليلية مترابطة عبر عدة جداول في استعلام واحد.","syntax":"SELECT h.name, SUM(q.reward) FROM heroes h JOIN quests q ON h.id = q.hero_id GROUP BY h.name ORDER BY 2 DESC;","missionEn":"Join heroes h with quests q on h.id = q.hero_id, group by h.name, and order by total_reward DESC.","missionAr":"اربط heroes h مع quests q على h.id = q.hero_id واجمع بـ h.name ورتب تنازلياً بـ total_reward DESC.","hintsEn":["Append at the end: ORDER BY total_reward DESC;","Full solution: SELECT h.name, COUNT(*) AS quests_count, SUM(q.reward) AS total_reward FROM heroes h INNER JOIN quests q ON h.id = q.hero_id GROUP BY h.name ORDER BY total_reward DESC;"],"hintsAr":["أضف في النهاية: ORDER BY total_reward DESC;","الحل: SELECT h.name, COUNT(*) AS quests_count, SUM(q.reward) AS total_reward FROM heroes h INNER JOIN quests q ON h.id = q.hero_id GROUP BY h.name ORDER BY total_reward DESC;"],"explanationEn":"1. INNER JOIN links heroes to completed quests.\n2. GROUP BY h.name sums rewards per hero.\n3. ORDER BY total_reward DESC puts highest earners on top.","explanationAr":"1. INNER JOIN يربط البطل بمهامه.\n2. GROUP BY h.name يجمع المكافآت لكل بطل.\n3. ORDER BY total_reward DESC يضع الأعلى مكافأة أولاً.","guardianNameEn":"Grand Archivist","guardianNameAr":"سيد الأرشيف","guardianColorHex":4287837162,"tier":"FREE"},{"id":12,"worldId":3,"xpReward":270,"conceptBadge":"Three-Table Relational JOIN","starterCode":"SELECT h.name, g.guild_name, q.title, q.reward\nFROM heroes h\nINNER JOIN guilds g ON h.guild_id = g.id\nINNER JOIN quests q ON ","solutionSql":"SELECT h.name, g.guild_name, q.title, q.reward FROM heroes h INNER JOIN guilds g ON h.guild_id = g.id INNER JOIN quests q ON h.id = q.hero_id;","titleEn":"12. Triple Nexus: Linking Three Tables","titleAr":"12. الرابط الثلاثي: دمج ثلاثة جداول معاً","difficultyEn":"Advanced+","difficultyAr":"متقدم جداً","storyEn":"The King wants a single report showing hero name, their guild name, their quest title, and reward by linking three tables together!","storyAr":"يريد الملك تقريراً شاملاً يعرض اسم البطل واسم نقابته وعنوان مهمته ومكافأتها بربط ثلاثة جداول معاً!","lessonEn":"Chain multiple INNER JOIN statements to connect 3 or more tables together following foreign-key relati uery filters power > 84.88 and sorts descending.","explanationAr":"1. يحسب الاستعلام الداخلي متوسط القوة أولاً.\n2. يقارن الاستعلام الخارجي قوة كل بطل بهذا المتوسط ويرتبها تنازلياً.","guardianNameEn":"Crimson Aether Drake","guardianNameAr":"تنين الأثير القرمزي","guardianColorHex":4292943176,"tier":"FREE"},{"id":18,"worldId":5,"xpReward":380,"conceptBadge":"WITH cte AS (...) SELECT","starterCode":"WITH elite_heroes AS (\n  SELECT name, role, power, gold FROM heroes WHERE level >= 8\n)\nSELECT name, role, power\nFROM elite_heroes\nORDER BY ","solutionSql":"WITH elite_heroes AS (SELECT name, role, power, gold FROM heroes WHERE level >= 8) SELECT name, role, power FROM elite_heroes ORDER BY power DESC;","titleEn":"18. Modular Architectures: CTE (WITH ... AS)","titleAr":"18. الجداول التعبيرية: CTE (WITH ... AS)","difficultyEn":"Master","difficultyAr":"محترف","storyEn":"In enterprise database engineering, Common Table Expressions break complex pipelines into clean, readable steps!","storyAr":"في هندسة البيانات الاحترافية، نستخدم CTE لتقسيم الاستعلامات المعقدة إلى خطوات واضحة منظمة!","lessonEn":"WITH cte_name AS (...) defines a temporary named result set you can immediately query in the main SELECT.","lessonAr":"تسمح جملة WITH cte_name AS بإنشاء جدول مؤقت يمكن الاستعلام منه مباشرة في جملة SELECT التالية.","syntax":"WITH cte AS (SELECT * FROM tbl) SELECT * FROM cte;","missionEn":"Define CTE elite_heroes for heroes with level >= 8, then select name, role, power ordered by power DESC.","missionAr":"عرّف CTE باسم elite_heroes للأبطال ذوي level >= 8، ثم اعرض name, role, power مرتبة بـ power DESC.","hintsEn":["Finish query with: ORDER BY power DESC;","Full solution: WITH elite_heroes AS (SELECT name, role, power, gold FROM heroes WHERE level >= 8) SELECT name, role, power FROM elite_heroes ORDER BY power DESC;"],"hintsAr":["أكمل الاستعلام بـ: ORDER BY power DESC;","الحل: WITH elite_heroes AS (SELECT name, role, power, gold FROM heroes WHERE level >= 8) SELECT name, role, power FROM elite_heroes ORDER BY power DESC;"],"explanationEn":"1. WITH elite_heroes AS (...) creates the temporary view.\n2. Main query reads from elite_heroes and orders by power DESC.","explanationAr":"1. تنشئ WITH elite_heroes جدولاً مؤقتاً للأبطال ذوي المستوى 8 فأعلى.\n2. يستعلم أمر SELECT الرئيسي منه ويرتب تنازلياً.","guardianNameEn":"Ancient Code Emperor","guardianNameAr":"إمبراطور الشفرات القديمة","guardianColorHex":4292552567,"tier":"FREE"},{"id":19,"worldId":5,"xpReward":420,"conceptBadge":"RANK() OVER (ORDER BY ...)","starterCode":"SELECT name, role, power,\n       RANK() OVER (ORDER BY power DESC) AS power_rank\nFROM ","solutionSql":"SELECT name, role, power, RANK() OVER (ORDER BY power DESC) AS power_rank FROM heroes;","titleEn":"19. Leaderboard Mastery: Analytical Window Functions","titleAr":"19. لوحة الشرف: دوال النوافذ التحليلية Window Functions","difficultyEn":"Legendary Master","difficultyAr":"محترف أسطوري","storyEn":"Rank every hero by combat power without collapsing rows or hiding details using native Window Functions!","storyAr":"رتّب جميع الأبطال حسب قوتهم القتالية دون دمج الصفوف أو إخفاء التفاصيل باستخدام دوال النوافذ!","lessonEn":"Window functions like RANK() OVER (...) calculate rankings across rows while preserving individual rows intact.","lessonAr":"تحسب دوال النوافذ مثل RANK() OVER الترتيب أو المجاميع عبر الصفوف مع الاحتفاظ بكل صف كاملاً دون دمج.","syntax":"SELECT col, RANK() OVER (ORDER BY col DESC) AS rnk FROM tbl;","missionEn":"Select name, role, power, and RANK() OVER (ORDER BY power DESC) AS power_rank from heroes.","missionAr":"اعرض name, role, power و RANK() OVER (ORDER BY power DESC) AS power_rank من جدول heroes.","hintsEn":["Complete the statement with: FROM heroes;","Full solution: SELECT name, role, power, RANK() OVER (ORDER BY power DESC) AS power_rank FROM heroes;"],"hintsAr":["أكمل الاستعلام بكتابة: FROM heroes;","الحل: SELECT name, role, power, RANK() OVER (ORDER BY power DESC) AS power_rank FROM heroes;"],"explanationEn":"1. RANK() assigns rank 1, 2, 3... ordered by power DESC.\n2. Every single hero row remains in the final output table.","explanationAr":"1. RANK() يمنح كل بطل ترتيباً 1، 2، 3... تنازلياً حسب القوة.\n2. تظل جميع صفوف الأبطال موجودة في الناتج.","guardianNameEn":"Grand Data Dragon","guardianNameAr":"تنين البيانات الأسطوري","guardianColorHex":4290648157,"tier":"FREE"},{"id":20,"worldId":5,"xpReward":450,"conceptBadge":"PARTITION BY in Window Functions","starterCode":"SELECT name, role, power,\n       ROW_NUMBER() OVER (PARTITION BY role ORDER BY power DESC) AS role_rank\nFROM ","solutionSql":"SELECT name, role, power, ROW_NUMBER() OVER (PARTITION BY role ORDER BY power DESC) AS role_rank FROM heroes;","titleEn":"20. The Ultimate Master: Window Partitioning","titleAr":"20. القمة المطلقة: تقسيم النوافذ PARTITION BY","difficultyEn":"Grandmaster Pro","difficultyAr":"خبير شامل (Grandmaster)","storyEn":"The Final Quest! Rank heroes inside their own role regiment so each role has its own #1, #2 champion!","storyAr":"المهمة الكبرى الأخيرة! رتّب الأبطال داخل كل تخصص بشكل مستقل بحيث يحصل كل تخصص على بطل أول وثانٍ!","lessonEn":"PARTITION BY inside OVER (...) restarts window ranking calculations for each distinct category.","lessonAr":"تُعيد PARTITION BY داخل دالة النافذة حساب الترتيب لكل فئة أو تخصص بشكل مستقل من الرقم 1.","syntax":"SELECT col, ROW_NUMBER() OVER (PARTITION BY cat ORDER BY val DESC) FROM tbl;","missionEn":"Select name, role, power, and ROW_NUMBER() OVER (PARTITION BY role ORDER BY power DESC) AS role_rank from heroes.","missionAr":"اعرض name, role, power و ROW_NUMBER() OVER (PARTITION BY role ORDER BY power DESC) AS role_rank من heroes.","hintsEn":["Append FROM heroes; at the end.","Final solution: SELECT name, role, power, ROW_NUMBER() OVER (PARTITION BY role ORDER BY power DESC) AS role_rank FROM heroes;"],"hintsAr":["أكمل بكتابة: FROM heroes;","الحل: SELECT name, role, power, ROW_NUMBER() OVER (PARTITION BY role ORDER BY power DESC) AS role_rank FROM heroes;"],"explanationEn":"1. PARTITION BY role divides ranking into Warrior, Mage, Archer, Healer partitions.\n2. ROW_NUMBER restarts at 1 for each role.","explanationAr":"1. PARTITION BY role يقسم الحساب لكل تخصص على حدة.\n2. يبدأ الترتيم ROW_NUMBER من 1 في كل تخصص.","guardianNameEn":"Cosmic SQL Architect","guardianNameAr":"معماري قواعد البيانات الكوني","guardianColorHex":4286781507,"tier":"FREE"},{"id":21,"worldId":5,"xpReward":460,"conceptBadge":"NOT EXISTS (Correlated Subquery)","starterCode":"SELECT name, role\nFROM heroes h\nWHERE NOT EXISTS (\n  SELECT 1 FROM quests q WHERE q.hero_id = h.id\n)\nORDER BY ","solutionSql":"SELECT name, role FROM heroes h WHERE NOT EXISTS (SELECT 1 FROM quests q WHERE q.hero_id = h.id) ORDER BY name ASC;","titleEn":"21. Unassigned Heroes: Correlated Subqueries & NOT EXISTS","titleAr":"21. الأبطال غير المكلفين: الاستعلامات المترابطة و NOT EXISTS","difficultyEn":"Grandmaster Pro","difficultyAr":"خبير شامل (Grandmaster)","storyEn":"The Commander needs to locate every hero who has never accepted a quest yet. Use NOT EXISTS to find idle heroes!","storyAr":"يحتاج القائد لمعرفة جميع الأبطال الذين لم يسبق تكليفهم بأي مهمة حتى الآن. استخدم NOT EXISTS لاستخراج الأبطال المتفرغين!","lessonEn":"NOT EXISTS tests for the non-existence of rows in a subquery linked to the outer query via correlated keys.","lessonAr":"تختبر NOT EXISTS عدم وجود أي صفوف في الاستعلام الفرعي المرتبط بالاستعلام الخارجي، وهي من أكفأ الطرق لتصفية العلاقات المفقودة.","syntax":"SELECT * FROM t1 WHERE NOT EXISTS (SELECT 1 FROM t2 WHERE t2.fk = t1.id);","missionEn":"Select name, role from heroes h where NOT EXISTS (SELECT 1 FROM quests q WHERE q.hero_id = h.id) ordered by name ASC.","missionAr":"اعرض name, role من heroes h حيث لا توجد مهمة مسندة إليهم باستخدام NOT EXISTS، مرتبة بـ name ASC.","hintsEn":["Complete the query with ORDER BY name ASC;","Full solution: SELECT name, role FROM heroes h WHERE NOT EXISTS (SELECT 1 FROM quests q WHERE q.hero_id = h.id) ORDER BY name ASC;"],"hintsAr":["أكمل الاستعلام بـ: ORDER BY name ASC;","الحل: SELECT name, role FROM heroes h WHERE NOT EXISTS (SELECT 1 FROM quests q WHERE q.hero_id = h.id) ORDER BY name ASC;"],"explanationEn":"1. For each hero in the outer query, the inner query checks if any quest references hero_id.\n2. Heroes 4, 5, 7 have no quests, so NOT EXISTS evaluates to true.","explanationAr":"1. يفحص الاستعلام الفرعي لكل بطل ما إذا كان رقمه مسجلاً في جدول المهام.\n2. الأبطال (حمزة، سلمى، زياد) ليس لديهم مهام، فتتحقق شروط NOT EXISTS.","guardianNameEn":"Vanguard Commander","guardianNameAr":"قائد الحرس المتقدم","guardianColorHex":4282595530,"tier":"FREE"},{"id":22,"worldId":5,"xpReward":480,"conceptBadge":"Self Joins (Table Joined with Itself)","starterCode":"SELECT h1.name AS hero1, h2.name AS hero2, h1.role\nFROM heroes h1\nINNER JOIN heroes h2 ON h1.role = h2.role AND h1.id < h2.id\nORDER BY ","solutionSql":"SELECT h1.name AS hero1, h2.name AS hero2, h1.role FROM heroes h1 INNER JOIN heroes h2 ON h1.role = h2.role AND h1.id < h2.id ORDER BY h1.role, hero1;","titleEn":"22. Peer Matchmaking: The Self Join Pattern","titleAr":"22. مطابقة الزملاء: الربط الذاتي (Self Join)","difficultyEn":"Grandmaster Pro","difficultyAr":"خبير شامل (Grandmaster)","storyEn":"Pair up comrades of the same combat role for duo training missions without pairing a hero with themselves!","storyAr":"شكّل ثنائيات تدريبية تجمع كل بطلين يمتلكان نفس التخصص القتالي من نفس الجدول دون تكرار البطل مع نفسه!","lessonEn":"A Self Join joins a table to itself using two distinct aliases (h1 and h2) with a comparison like h1.id < h2.id to avoid self-pairs and duplicates.","lessonAr":"الربط الذاتي Self Join يربط الجدول بنفسه عبر اسمين مستعارين مختلفين (h1 و h2) وشرط مثل h1.id < h2.id لمنع تكرار نفس البطل أو الأزواج المعكوسة.","syntax":"SELECT a.col, b.col FROM tbl a JOIN tbl b ON a.cat = b.cat AND a.id < b.id;","missionEn":"Select h1.name AS hero1, h2.name AS hero2, h1.role from heroes h1 joined with heroes h2 on role and h1.id < h2.id ordered by h1.role, hero1.","missionAr":"اعرض h1.name AS hero1, h2.name AS hero2, h1.role بربط heroes h1 مع heroes h2 لنفس التخصص وشرط h1.id < h2.id مرتبة بـ h1.role, hero1.","hintsEn":["Finish with: ORDER BY h1.role, hero1;","Full solution: SELECT h1.name AS hero1, h2.name AS hero2, h1.role FROM heroes h1 INNER JOIN heroes h2 ON h1.role = h2.role AND h1.id < h2.id ORDER BY h1.role, hero1;"],"hintsAr":["أكمل الاستعلام بـ: ORDER BY h1.role, hero1;","الحل: SELECT h1.name AS hero1, h2.name AS hero2, h1.role FROM heroes h1 INNER JOIN heroes h2 ON h1.role = h2.role AND h1.id < h2.id ORDER BY h1.role, hero1;"],"explanationEn":"1. Matching h1.role = h2.role finds heroes sharing the same role.\n2. h1.id < h2.id guarantees each duo appears only once without mirrored duplicates.","explanationAr":"1. يطابق h1.role = h2.role الأبطال من نفس التخصص.\n2. يضمن h1.id < h2.id ظهور كل ثنائي مرة واحدة دون تكرار عكسي.","guardianNameEn":"Mirror Champion","guardianNameAr":"بطل المرايا المزدوجة","guardianColorHex":4279080072,"tier":"FREE"},{"id":23,"worldId":5,"xpReward":500,"conceptBadge":"String & Text Functions (UPPER, LENGTH)","starterCode":"SELECT UPPER(name) AS upper_name, role, LENGTH(role) AS role_len\nFROM heroes\nWHERE power >= 85\nORDER BY ","solutionSql":"SELECT UPPER(name) AS upper_name, role, LENGTH(role) AS role_len FROM heroes WHERE power >= 85 ORDER BY upper_name ASC;","titleEn":"23. Royal Heraldry: Text Manipulation & Formatting","titleAr":"23. السجلات الملكية: معالجة النصوص والدوال النصية","difficultyEn":"Grandmaster Pro","difficultyAr":"خبير شامل (Grandmaster)","storyEn":"The King decrees all elite hero titles be capitalized in official proclamations. Transform and measure data outputs!","storyAr":"أصدر الملك مرسوماً بكتابة أسماء نخبة الأبطال بأحرف كبيرة في السجلات الرسمية وحساب أطوال تخصصاتهم!","lessonEn":"SQL provides built-in scalar string functions like UPPER(), LOWER(), LENGTH(), and SUBSTR() to clean and transform text.","lessonAr":"توفر SQL دوالاً قياسية لمعالجة النصوص مثل UPPER (تكبير الأحرف)، LOWER (تصغير الأحرف)، و LENGTH (حساب عدد الحروف).","syntax":"SELECT UPPER(col), LENGTH(col) FROM tbl WHERE cond;","missionEn":"Select UPPER(name) AS upper_name, role, LENGTH(role) AS role_len from heroes where power >= 85 ordered by upper_name ASC.","missionAr":"اعرض UPPER(name) AS upper_name, role, LENGTH(role) AS role_len من heroes للأبطال ذوي power >= 85 مرتبة بـ upper_name ASC.","hintsEn":["Append ORDER BY upper_name ASC; at the end.","Full solution: SELECT UPPER(name) AS upper_name, role, LENGTH(role) AS role_len FROM heroes WHERE power >= 85 ORDER BY upper_name ASC;"],"hintsAr":["أضف في النهاية: ORDER BY upper_name ASC;","الحل: SELECT UPPER(name) AS upper_name, role, LENGTH(role) AS role_len FROM heroes WHERE power >= 85 ORDER BY upper_name ASC;"],"explanationEn":"1. UPPER(name) standardizes hero names to capital letters.\n2. LENGTH(role) counts characters in the role string.","explanationAr":"1. تُحوّل دالة UPPER أسماء الأبطال لحروف كبيرة رسمية.\n2. تحسب دالة LENGTH عدد أحرف اسم التخصص بدقة.","guardianNameEn":"Royal Scribe","guardianNameAr":"الكاتب الملكي الأعظم","guardianColorHex":4290007817,"tier":"FREE"},{"id":24,"worldId":5,"xpReward":520,"conceptBadge":"Running Totals: SUM() OVER (ORDER BY id)","starterCode":"SELECT id, name, gold,\n       SUM(gold) OVER (ORDER BY id ASC) AS running_gold\nFROM ","solutionSql":"SELECT id, name, gold, SUM(gold) OVER (ORDER BY id ASC) AS running_gold FROM heroes;","titleEn":"24. Treasury Ledger: Cumulative Running Totals","titleAr":"24. سجل الخزينة: المجاميع التراكمية Running Totals","difficultyEn":"Grandmaster Pro","difficultyAr":"خبير شامل (Grandmaster)","storyEn":"The Royal Auditor needs a running audit of kingdom wealth, tracking accumulated gold row by row!","storyAr":"يطلب المدقق المالي الملكي كشف حساب تراكمي لذهب المملكة، بحيث يُحسب إجمالي الذهب المتراكم صفاً بعد صف!","lessonEn":"SUM(col) OVER (ORDER BY col2) creates a cumulative running total across rows, essential for financial and telemetry analytics.","lessonAr":"تُنشئ SUM(col) OVER (ORDER BY ...) مجموعاً تراكمياً يزيد مع كل صف، وهي الأداة الأساسية للتقارير المالية والتحليل الزمني.","syntax":"SELECT id, val, SUM(val) OVER (ORDER BY id) AS running_total FROM tbl;","missionEn":"Select id, name, gold, and SUM(gold) OVER (ORDER BY id ASC) AS running_gold from heroes.","missionAr":"اعرض id, name, gold و SUM(gold) OVER (ORDER BY id ASC) AS running_gold من جدول heroes.","hintsEn":["Complete the query with FROM heroes;","Full solution: SELECT id, name, gold, SUM(gold) OVER (ORDER BY id ASC) AS running_gold FROM heroes;"],"hintsAr":["أكمل الاستعلام بكتابة: FROM heroes;","الحل: SELECT id, name, gold, SUM(gold) OVER (ORDER BY id ASC) AS running_gold FROM heroes;"],"explanationEn":"1. SUM(gold) OVER (ORDER BY id ASC) calculates running balance incrementally.\n2. Row 1 has 450, row 2 has 450+620=1070, row 3 has 1070+280=1350...","explanationAr":"1. تحسب الدالة الرصيد التراكمي تدريجياً.\n2. الصف الأول 450، الصف الثاني 1070، الصف الثالث 1350 حتى 3290 في النهاية.","guardianNameEn":"Master Auditor of the Realm","guardianNameAr":"كبير المدققين الماليين","guardianColorHex":4278483031,"tier":"FREE"},{"id":25,"worldId":5,"xpReward":600,"conceptBadge":"Master Enterprise: CTE + JOIN + Window","starterCode":"WITH warrior_quests AS (\n  SELECT h.name, h.role, q.title\n  FROM heroes h\n  INNER JOIN quests q ON h.id = q.hero_id\n  WHERE h.role = 'Warrior'\n)\nSELECT name, title,\n       ROW_NUMBER() OVER (ORDER BY name ASC, title ASC) AS row_num\nFROM ","solutionSql":"WITH warrior_quests AS (SELECT h.name, h.role, q.title FROM heroes h INNER JOIN quests q ON h.id = q.hero_id WHERE h.role = 'Warrior') SELECT name, title, ROW_NUMBER() OVER (ORDER BY name ASC, title ASC) AS row_num FROM warrior_quests;","titleEn":"25. Crown of the Grand Architect: CTE + JOIN + Window Pipeline","titleAr":"25. تاج المعماري الأعظم: خط أنابيب CTE و JOIN ودوال النوافذ","difficultyEn":"Grandmaster Pro","difficultyAr":"خبير شامل (Grandmaster)","storyEn":"The Pinnacle of SQL Mastery! Build an end-to-end analytical pipeline combining CTE, relational JOINs, and window numbering in a single master query!","storyAr":"قمة احتراف وهندسة قواعد البيانات! ابنِ خط استعلام تحليلي متكامل يدمج CTE والربط المتقاطع INNER JOIN ودوال النوافذ الترقيمية معاً!","lessonEn":"Combining CTEs, JOINs, and Window Functions represents the pinnacle of modern SQL engineering used across tech giants and enterprise data platforms.","lessonAr":"يمثل الدمج بين CTE والربط JOIN ودوال النوافذ Window Functions أعلى معايير هندسة البيانات الاحترافية في كبرى الشركات العالمية.","syntax":"WITH cte AS (SELECT ... FROM a JOIN b ON ...) SELECT ..., ROW_NUMBER() OVER (...) FROM cte;","missionEn":"Write CTE warrior_quests for Warrior heroes and their quests, then select name, title, and ROW_NUMBER() OVER (ORDER BY name ASC, title ASC) AS row_num from warrior_quests.","missionAr":"اكتب CTE باسم warrior_quests لأبطال Warrior ومهامهم، ثم اعرض name, title و ROW_NUMBER() OVER (ORDER BY name ASC, title ASC) AS row_num من warrior_quests.","hintsEn":["Finish query with FROM warrior_quests;","Full solution: WITH warrior_quests AS (SELECT h.name, h.role, q.title FROM heroes h INNER JOIN quests q ON h.id = q.hero_id WHERE h.role = 'Warrior') SELECT name, title, ROW_NUMBER() OVER (ORDER BY name ASC, title ASC) AS row_num FROM warrior_quests;"],"hintsAr":["أكمل الاستعلام بكتابة: FROM warrior_quests;","الحل: WITH warrior_quests AS (SELECT h.name, h.role, q.title FROM heroes h INNER JOIN quests q ON h.id = q.hero_id WHERE h.role = 'Warrior') SELECT name, title, ROW_NUMBER() OVER (ORDER BY name ASC, title ASC) AS row_num FROM warrior_quests;"],"explanationEn":"1. CTE warrior_quests joins heroes with quests and filters by role = 'Warrior'.\n2. Main query numbers results cleanly using ROW_NUMBER() ordered by name and title.","explanationAr":"1. يقوم CTE بدمج الأبطال والمهام وتصفية المحاربين.\n2. يقوم الاستعلام الرئيسي بترقيم المهام الناتجة تسلسلياً واحترافياً.","guardianNameEn":"Gran f there is no match in the right table?","questionAr":"أي نوع ربط يُرجع جميع صفوف الجدول الأيسر حتى لو لم يوجد تطابق في الجدول الأيمن؟","options":["INNER JOIN","LEFT JOIN","CROSS JOIN","FULL JOIN"],"correctIndex":1,"explanationEn":"LEFT JOIN preserves all rows from the left table, filling missing right-side columns with NULL.","explanationAr":"يحتفظ LEFT JOIN بجميع صفوف الجدول الأيسر ويضع NULL في أعمدة الجدول الأيمن غير المتطابقة."},{"id":3,"questionEn":"What happens if you run an UPDATE statement without a WHERE clause?","questionAr":"ماذا يحدث عند تنفيذ أمر UPDATE بدون جملة WHERE؟","options":["Updates only the first row","Throws a syntax error","Updates EVERY row in the table","Deletes the table"],"correctIndex":2,"explanationEn":"Omitting WHERE modifies every single row in the entire table!","explanationAr":"إغفال شرط WHERE يؤدي لتعديل جميع الصفوف الموجودة في الجدول بالكامل!"},{"id":4,"questionEn":"Which keyword removes duplicate rows from a query result?","questionAr":"ما الكلمة المفتاحية التي تحذف القيم المكررة من نتائج الاستعلام؟","options":["UNIQUE","DISTINCT","DIFFERENT","SINGLE"],"correctIndex":1,"explanationEn":"SELECT DISTINCT returns only unique values across selected columns.","explanationAr":"تُستخدم DISTINCT بعد SELECT لاسترجاع القيم الفريدة دون تكرار."},{"id":5,"questionEn":"Which clause defines a Common Table Expression (CTE) in SQL?","questionAr":"ما الكلمة التي تبدأ بها الجداول التعبيرية المشتركة (CTE) في SQL؟","options":["TEMP","WITH","OVER","CASE"],"correctIndex":1,"explanationEn":"WITH cte_name AS (...) defines a clean temporary result set.","explanationAr":"تبدأ الجداول التعبيرية المشتركة بكلمة WITH متبوعة باسم الجدول المؤقت و AS."},{"id":6,"questionEn":"What does the COUNT(*) function return?","questionAr":"ماذا تُرجع دالة COUNT(*)؟","options":["Sum of all numbers","Total number of rows in the table or group","Highest value","Average of rows"],"correctIndex":1,"explanationEn":"COUNT(*) counts the total number of rows matching the query.","explanationAr":"تحسب COUNT(*) إجمالي عدد الصفوف المطابقة للاستعلام."},{"id":7,"questionEn":"Which operator is used to search for a specified pattern in a column?","questionAr":"أي معامل يُستخدم للبحث عن نمط نصي محدد داخل العمود؟","options":["IN","LIKE","BETWEEN","CONTAINS"],"correctIndex":1,"explanationEn":"LIKE paired with % and _ wildcards enables pattern matching.","explanationAr":"يُستخدم LIKE مع رمزي % و _ لمطابقة الأنماط النصية."},{"id":8,"questionEn":"What is the difference between RANK() and ROW_NUMBER()?","questionAr":"ما الفرق بين دالتي RANK() و ROW_NUMBER() في دوال النوافذ؟","options":["They are identical","RANK() gives same rank to tied values; ROW_NUMBER() assigns distinct sequential integers","ROW_NUMBER() skips numbers","RANK() only works on text"],"correctIndex":1,"explanationEn":"RANK() ties matching values (1, 2, 2, 4) whereas ROW_NUMBER() always increments strictly (1, 2, 3, 4).","explanationAr":"تمنح RANK نفس الرقم للقيم المتساوية بينما ترقم ROW_NUMBER تسلسلياً دائماً دون تكرار."},{"id":9,"questionEn":"How do you test for missing/empty values in a column?","questionAr":"كيف تتحقق من القيم الفارغة أو غير المعرفة (NULL) في SQL؟","options":["col = NULL","col IS NULL","col == NULL","col IN (NULL)"],"correctIndex":1,"explanationEn":"NULL represents unknown, so equality (=) fails. You must use IS NULL or IS NOT NULL.","explanationAr":"تمثل NULL قيمة غير معلومة لذلك لا تعمل معها المساواة =، بل يجب كتابة IS NULL أو IS NOT NULL."},{"id":10,"questionEn":"Which clause is used to limit the number of rows returned?","questionAr":"أي جملة تُستخدم لتحديد الحد الأقصى لعدد الصفوف المسترجعة؟","options":["TOP_ONLY","LIMIT","MAX_ROWS","CAP"],"correctIndex":1,"explanationEn":"LIMIT N caps the result to at most N rows.","explanationAr":"تُستخدم LIMIT N لتحديد عدد الصفوف الناتجة بـ N صف فقط."},{"id":11,"questionEn":"What is the default sort order for ORDER BY if not specified?","questionAr":"ما هو ترتيب الفرز الافتراضي في ORDER BY إذا لم يُحدد؟","options":["DESC (Descending)","ASC (Ascending)","Random","By Primary Key"],"correctIndex":1,"explanationEn":"ORDER BY defaults to ASC (ascending from smallest to largest).","explanationAr":"ترتب ORDER BY تصاعدياً ASC تلقائياً من الأصغر إلى الأكبر."},{"id":12,"questionEn":"Which SQL operator checks if a value falls inclusively within a range?","questionAr":"أي معامل يتحقق مما إذا كانت القيمة تقع ضمن نطاق محدد شاملاً الطرفين؟","options":["WITHIN","BETWEEN","RANGE","INSIDE"],"correctIndex":1,"explanationEn":"BETWEEN x AND y checks if a value is >= x and <= y inclusively.","explanationAr":"يتحقق المعامل BETWEEN x AND y مما إذا كانت القيمة محصورة بين الحدين وشاملة لهما."},{"id":13,"questionEn":"Which aggregate function ignores NULL values?","questionAr":"أي من الدوال التجميعية التالية تتجاهل قيم NULL تلقائياً؟","options":["COUNT(col)","AVG(col)","SUM(col)","All of the above"],"correctIndex":3,"explanationEn":"All standard aggregate functions like SUM, AVG, and COUNT(column) ignore NULL values.","explanationAr":"جميع دوال التجميع القياسية مثل SUM و AVG و COUNT(column) تتجاهل قيم NULL تلقائياً."},{"id":14,"questionEn":"What is the result of a CROSS JOIN between a table with 4 rows and a table with 5 rows?","questionAr":"ما عدد الصفوف الناتجة عن CROSS JOIN بين جدول به 4 صفوف وجدول به 5 صفوف؟","options":["9 rows","20 rows","1 row","5 rows"],"correctIndex":1,"explanationEn":"CROSS JOIN produces a Cartesian product: 4 * 5 = 20 rows.","explanationAr":"ينتج CROSS JOIN الضرب الديكارتي لجميع الاحتمالات: 4 × 5 = 20 صفاً."},{"id":15,"questionEn":"Which clause is mandatory in a CASE expression?","questionAr":"ما هي الكلمة التي لا بد من إنهاء تعبير CASE بها في SQL؟","options":["FINISH","END","STOP","EXIT"],"correctIndex":1,"explanationEn":"Every CASE construct must conclude with the END keyword (often followed by AS alias).","explanationAr":"يجب دائماً إنهاء جملة CASE بالكلمة المفتاحية END متبوعة باسم العمود المستعار."},{"id":16,"questionEn":"Which command completely deletes a table structure and all its data?","questionAr":"أي أمر يقوم بحذف بنية الجدول وبياناته بالكامل من قاعدة البيانات؟","options":["DELETE TABLE","DROP TABLE","REMOVE TABLE","TRUNCATE ONLY"],"correctIndex":1,"explanationEn":"DROP TABLE removes the entire table definition along with its indexes and data.","explanationAr":"يقوم أمر DROP TABLE بحذف الجدول بالكامل وتعريفه ومؤشراته من قاعدة البيانات."},{"id":17,"questionEn":"Which wildcard in SQL LIKE matches exactly ONE single character?","questionAr":"أي رمز بديل في معامل LIKE يطابق حرفاً واحداً فقط بالضبط؟","options":["% (Percent)","_ (Underscore)","* (Asterisk)","? (Question mark)"],"correctIndex":1,"explanationEn":"Underscore (_) matches exactly one character, while % matches zero or more characters.","explanationAr":"يطابق الرمز الشرطة السفلية (_) حرفاً واحداً بالضبط، بينما يطابق % أي عدد من الأحرف."},{"id":18,"questionEn":"What does the UNION operator do compared to UNION ALL?","questionAr":"ما الفرق بين UNION و UNION ALL عند دمج نتائج استعلامين؟","options":["UNION keeps all duplicates; UNION ALL removes them","UNION removes duplicate rows; UNION ALL keeps all duplicates","UNION only works on numbers","They are strictly identical"],"correctIndex":1,"explanationEn":"UNION executes a distinct deduplication pass, while UNION ALL simply appends results directly and faster.","explanationAr":"يقوم UNION بحذف الصفوف المكررة بينما يحتفظ UNION ALL بكافة الصفوف بما فيها التكرارات وهو أسرع."},{"id":19,"questionEn":"Which window function clause divides the result set into independent partitions/buckets?","questionAr":"أي جملة في دوال النوافذ تُقسم البيانات إلى مجموعات أو نوافذ فرعية مستقلة؟","options":["GROUP BY","PARTITION BY","SPLIT BY","DIVIDE BY"],"correctIndex":1,"explanationEn":"OVER (PARTITION BY col) segments the rows into groups over which the window function operates.","explanationAr":"تُستخدم PARTITION BY داخل جملة OVER لتقسيم الصفوف إلى نوافذ فرعية يتم تطبيق الدالة عليها."},{"id":20,"questionEn":"What is a correlated subquery in SQL?","questionAr":"ما هو الاستعلام الفرعي المرتبط (Correlated Subquery)؟","options":["A subquery that runs once before the outer query","A subquery that references columns from the outer query and evaluates row-by-row","A subquery that only joins two tables","A subquery written inside the FROM clause"],"correctIndex":1,"explanationEn":"A correlated subquery references values from the outer query for each evaluated row.","explanationAr":"هو استعلام فرعي يعتمد على قيم من الاستعلام الخارجي ويُعاد تقييمه لكل صف من صفوف الاستعلام الخارجي."},{"id":21,"questionEn":"Which function converts a string to all uppercase letters?","questionAr":"ما الدالة القياسية التي تحول النص إلى حروف كبيرة (Uppercase)؟","options":["TO_UPPER()","UPPER()","CAPITALIZE()","BIG()"],"correctIndex":1,"explanationEn":"UPPER(text) returns the string with all characters converted to uppercase.","explanationAr":"تُرجع دالة UPPER(text) السلسلة النصية بحروف كبيرة كاملة."},{"id":22,"questionEn":"What does COALESCE(val1, val2, val3) return?","questionAr":"ماذا تُرجع دالة COALESCE(val1, val2, val3) في SQL؟","options":["The maximum value","The first non-NULL value in the list","The average value","The count of items"],"correctIndex":1,"explanationEn":"COALESCE returns the very first non-NULL expression from its argument list.","explanationAr":"تُرجع دالة COALESCE أول قيمة غير فارغة (غير NULL) تصادفها في قائمة المعاملات."},{"id":23,"questionEn":"What does the EXISTS operator return?","questionAr":"ما هي القيمة التي يُرجعها معامل EXISTS في SQL؟","options":["A table of rows","TRUE if the subquery returns at least one row, FALSE otherwise","The number of rows as an integer","The primary key of the match"],"correctIndex":1,"explanationEn":"EXISTS evaluates to TRUE as soon as the inner subquery returns at least 1 record.","explanationAr":"يُرجع EXISTS قيمة منطقية TRUE بمجرد أن يجد الاستعلام الفرعي صفاً واحداً على الأقل، و FALSE إذا كان فارغاً."},{"id":24,"questionEn":"Which SQL clause is executed first logically in a query pipeline?","questionAr":"أي جملة تُنفذ منطقياً في البداية عند تشغيل استعلام SQL؟","options":["SELECT","WHERE","FROM","ORDER BY"],"correctIndex":2,"explanationEn":"The SQL engine first identifies the data source (FROM / JOIN), then WHERE, GROUP BY, HAVING, SELECT, and finally ORDER BY.","explanationAr":"يبدأ محرك SQL منطقياً بتحديد مصدر البيانات (FROM والربط)، ثم الشروط WHERE، ثم التجميع GROUP BY، ثم SELECT وأخيراً ORDER BY."},{"id":25,"questionEn":"What is the primary key constraint used for?","questionAr":"ما هو الغرض الأساسي من قيد المفتاح الأساسي (PRIMARY KEY)؟","options":["To encrypt table data","To uniquely identify each record in a table without nulls","To speed up text translation","To allow duplicate values"],"correctIndex":1,"explanationEn":"PRIMARY KEY guarantees unique and non-null identification for every row in a relational table.","explanationAr":"يضمن المفتاح الأساسي تمييز كل صف في الجدول بشكل فريد مع منع القيم الفارغة NULL والتكرار."}],"reference":[{"titleEn":"Selecting Columns & Distinct Values","titleAr":"استرجاع الأعمدة والقيم الفريدة (SELECT & DISTINCT)","levelEn":"Beginner","levelAr":"مبتدئ","descriptionEn":"SELECT retrieves specific columns or all columns (*) from a table. DISTINCT eliminates duplicate values.","descriptionAr":"يُستخدم SELECT لاختيار أعمدة محددة أو جميع الأعمدة (*) من الجدول، وتحذف DISTINCT التكرارات.","sampleSql":"SELECT DISTINCT role FROM heroes;"},{"titleEn":"Filtering with WHERE & Operators","titleAr":"تصفية البيانات بالشروط (WHERE, BETWEEN, IN, LIKE)","levelEn":"Beginner","levelAr":"مبتدئ","descriptionEn":"Filter rows using comparison operators, logical AND/OR, set membership (IN), ranges (BETWEEN), or pattern matching (LIKE).","descriptionAr":"تصفية الصفوف باستخدام المعاملات المنطقية AND و OR ومطابقة القوائم IN والنطاقات BETWEEN والأنماط LIKE.","sampleSql":"SELECT name, role, power FROM heroes WHERE power BETWEEN 75 AND 95 AND role IN ('Mage', 'Warrior');"},{"titleEn":"Sorting & Limiting (ORDER BY & LIMIT)","titleAr":"الترتيب وتحديد عدد النتائج (ORDER BY & LIMIT)","levelEn":"Beginner","levelAr":"مبتدئ","descriptionEn":"ORDER BY sorts rows ascending (ASC) or descending (DESC). LIMIT caps the number of output rows.","descriptionAr":"يرتب ORDER BY النتائج تصاعدياً أو تنازلياً DESC، ويحدد LIMIT الحد الأقصى لعدد النتائج.","sampleSql":"SELECT name, gold FROM heroes ORDER BY gold DESC LIMIT 4;"},{"titleEn":"Aggregates (COUNT, SUM, AVG, MIN, MAX)","titleAr":"دوال التجميع الإحصائية (COUNT, SUM, AVG, MIN, MAX)","levelEn":"Intermediate","levelAr":"متوسط","descriptionEn":"Compute summary metrics across multiple rows such as counts, sums, averages, and extremes.","descriptionAr":"تُجري عمليات حسابية على مجموعة من الصفوف لإنتاج ملخص إحصائي دقيق.","sampleSql":"SELECT COUNT(*) AS total_count, AVG(power) AS avg_power, SUM(gold) AS total_gold FROM heroes;"},{"titleEn":"Grouping & Group Filtering (GROUP BY & HAVING)","titleAr":"التجميع وتصفية المجموعات (GROUP BY & HAVING)","levelEn":"Intermediate","levelAr":"متوسط","descriptionEn":"GROUP BY buckets rows by category; HAVING filters groups based on aggregate computations.","descriptionAr":"تُجمع GROUP BY الصفوف حسب الفئة، وتصفي HAVING المجموعات بناءً على نتائج دوال التجميع.","sampleSql":"SELECT role, COUNT(*) AS cnt, AVG(power) AS avg_power FROM heroes GROUP BY role HAVING COUNT(*) >= 2;"},{"titleEn":"Relational Joins (INNER JOIN & LEFT JOIN)","titleAr":"ربط الجداول العلائقية (INNER JOIN & LEFT JOIN)","levelEn":"Advanced","levelAr":"متقدم","descriptionEn":"INNER JOIN returns matching rows between tables; LEFT JOIN preserves all left-table rows with NULLs for unmatched right rows.","descriptionAr":"يدمج INNER JOIN الصفوف المتطابقة في الجدولين، بينما يحتفظ LEFT JOIN بجميع صفوف الجدول الأيسر.","sampleSql":"SELECT h.name, h.role, g.guild_name, g.city FROM heroes h LEFT JOIN guilds g ON h.guild_id = g.id;"},{"titleEn":"Conditional Expressions (CASE WHEN)","titleAr":"المنطق الشرطي داخل الاستعلام (CASE WHEN)","levelEn":"Advanced","levelAr":"متقدم","descriptionEn":"Evaluates IF-THEN-ELSE logic per row to generate dynamic categorized columns.","descriptionAr":"يُنشئ أعمدة محسوبة ديناميكياً بناءً على شروط متعددة تشبه جمل IF-ELSE.","sampleSql":"SELECT item_name, price, CASE WHEN price >= 300 THEN 'Premium' ELSE 'Standard' END AS price_tag FROM items;"},{"titleEn":"Common Table Expressions (CTE WITH ... AS)","titleAr":"الجداول التعبيرية المشتركة (CTE - WITH ... AS)","levelEn":"Master","levelAr":"محترف","descriptionEn":"Defines reusable named temporary result sets for modular, readable complex queries.","descriptionAr":"تسمح بتعريف جدول مؤقت باستخدام WITH لتسهيل التحليلات وتقسيم الاستعلامات المعقدة.","sampleSql":"WITH rich_heroes AS (SELECT name, gold FROM heroes WHERE gold >= 400) SELECT * FROM rich_heroes ORDER BY gold DESC;"},{"titleEn":"Analytical Window Functions (OVER & RANK)","titleAr":"دوال النوافذ التحليلية (Window Functions - OVER)","levelEn":"Master","levelAr":"محترف","descriptionEn":"Calculates rankings and running metrics across rows without collapsing the underlying dataset.","descriptionAr":"تحسب الترتيب (RANK, ROW_NUMBER) أو الإحصائيات عبر نافذة من الصفوف دون تقليص عدد الصفوف الأصلية.","sampleSql":"SELECT name, role, power, RANK() OVER (PARTITION BY role ORDER BY power DESC) AS role_rank FROM heroes;"}]};window.__SEED="CREATE TABLE guilds (\n                    id INTEGER PRIMARY KEY,\n                    guild_name TEXT NOT NULL,\n                    city TEXT NOT NULL,\n                    founded_year INTEGER\n                );\nINSERT INTO guilds VALUES (1, 'Castle Guards', 'Arcadia', 1120);\nINSERT INTO guilds VALUES (2, 'Crystal Sages', 'Athena', 1085);\nINSERT INTO guilds VALUES (3, 'Desert Hawks', 'Sun Oasis', 1190);\nINSERT INTO guilds VALUES (4, 'Shadow Knights', 'North Keep', 1210);\nCREATE TABLE heroes (\n                    id INTEGER PRIMARY KEY,\n                    name TEXT NOT NULL,\n                    role TEXT NOT NULL,\n                    level INTEGER NOT NULL,\n                    power INTEGER NO
